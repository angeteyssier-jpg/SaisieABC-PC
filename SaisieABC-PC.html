<style>
  .abc-app, .abc-app * { box-sizing: border-box; min-width: 0; }
  .abc-app button, .abc-app .tab, .abc-app .k { -webkit-tap-highlight-color: transparent; }
  .abc-app { width: 100%; max-width: 100%; padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #1a1a1a; background: #f5f4ef; border-radius: 8px;
    position: relative; overflow-x: hidden; }
  .abc-app.fullscreen { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; border-radius: 0; z-index: 9999; overflow-y: auto; }

  /* === LAYOUT PC : 2 colonnes === */
  .pc-layout { display: grid; grid-template-columns: 460px 1fr; gap: 10px; align-items: stretch; }
  .pc-left { display: flex; flex-direction: column; gap: 6px; }
  .pc-right { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .ver-badge { display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; color: #5f5e5a;
    background: #ebe9e0; padding: 4px 10px; border-radius: 6px; margin-bottom: 4px; }
  .ver-badge b { color: #1a1a1a; font-weight: 700; }

  .dim-info { background: #ebe9e0; border: 1px solid #d8d6ce; border-radius: 6px;
    padding: 4px 8px; font-size: 13px; color: #5f5e5a;
    display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .dim-info b { color: #185fa5; font-weight: 700; }

  .abc-card { background: #ffffff; border: 1px solid #d8d6ce; border-radius: 6px; padding: 6px; height: 100%; }
  /* Partition : utilise toute la hauteur de la fenetre (moins le badge version et les marges) */
  .score-wrap { width: 100%; height: calc(100vh - 85px); min-height: 360px; }
  .score-wrap svg { width: 100%; height: 100%; display: block; }

  .ctx-card { background: #ebe9e0; border: 1px solid #d8d6ce; border-radius: 10px;
    padding: 8px 12px;
    font-size: 20px; color: #1a1a1a; line-height: 1.3; font-weight: 700; }
  .ctx-card > div { margin: 2px 0; }
  .ctx-card .line-small { font-size: 14px; font-weight: 700; }
  .ctx-card b { color: #185fa5; font-weight: 700; }

  /* Boutons standards : compacts pour PC souris */
  .abc-app button.k { display: flex; align-items: center; justify-content: center; gap: 4px;
    width: 100%; height: 44px; padding: 0 4px;
    background: #ffffff; border: 2px solid #b4b2a9; border-radius: 8px;
    font-family: inherit; font-size: 18px; font-weight: 700; color: #1a1a1a;
    cursor: pointer; text-align: center; line-height: 1;
    -webkit-tap-highlight-color: transparent; -webkit-appearance: none; appearance: none;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    transition: background 0.1s; }
  .abc-app button.k:hover { background: #f0eee5; }
  .abc-app button.k:active { background: #e8e6df; }
  .abc-app button.k:disabled { color: #bbb8a8; background: #f3f1ea; cursor: not-allowed; }
  .abc-app button.k.active { background: #cfe5fa; border-color: #185fa5; color: #0c447c; }
  .abc-app button.k.symbol { font-size: 22px; font-family: "Times New Roman", serif; }
  .abc-app button.k.primary { background: #185fa5; border-color: #185fa5; color: #ffffff; }
  .abc-app button.k.primary:hover { background: #1a6cbb; }
  .abc-app button.k.clef-small { font-size: 20px; }

  /* Notes : un peu plus hautes avec sub-label */
  .note-btn { flex-direction: column !important; gap: 1px !important; height: 56px !important; }
  .note-btn .lbl { font-size: 20px; font-weight: 700; line-height: 1; }
  .note-btn .sub { font-size: 14px; font-weight: 400; color: #5f5e5a; line-height: 1; }

  .row-grid { display: grid; gap: 5px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }
  .row-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .row-5 { grid-template-columns: repeat(5, 1fr); }
  .row-6 { grid-template-columns: repeat(6, 1fr); }
  .row-7 { grid-template-columns: repeat(7, 1fr); }

  /* Navigation : 6 boutons (à droite, au-dessus partition) */
  .nav-bar { display: grid; grid-template-columns: repeat(6, 1fr);
    gap: 5px;
    background: #fdf1d8; border: 2px solid #e2b840; padding: 5px;
    border-radius: 10px; }
  .nav-bar .k { background: #fffaee; border-color: #e2b840;
    font-size: 20px; height: 42px; padding: 0; }
  .nav-bar .k.dbtxt { font-size: 18px; font-weight: 700; }
  .nav-bar .k:hover { background: #faecc4; }
  .nav-bar .k:active { background: #f5e2a8; }

  /* Onglets : disposés en grille 2 colonnes dans la colonne de gauche */
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr) 0.6fr;
    gap: 3px;
    border-bottom: 2px solid #b4b2a9; }
  .tab { height: 44px;
    background: #ebe9e0; border: 2px solid #b4b2a9; border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-family: inherit; font-size: 15px; font-weight: 700; color: #5f5e5a;
    cursor: pointer; padding: 0 2px;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: background 0.1s; }
  .tab:hover { background: #ddd9c9; }
  .tab.active { background: #ffffff; color: #0c447c; border-color: #185fa5;
    margin-bottom: -2px; padding-bottom: 2px; }
  .tab:active { background: #d6d4cb; }
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 5px; }

  /* Octave / contrôles : compactes */
  .oct-row, .control-row { display: grid; grid-template-columns: 1fr 1.4fr 1fr;
    gap: 5px;
    background: #ebe9e0; padding: 5px; border-radius: 10px;
    align-items: center; }
  .oct-row .label, .control-row .label { font-size: 20px; color: #1a1a1a; text-align: center; font-weight: 700; }
  .oct-row .label b, .control-row .label b { color: #185fa5; font-size: 22px; margin-left: 4px; }

  /* Ligne transposer */
  .transpose-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;
    background: #ebe9e0; padding: 5px; border-radius: 10px; align-items: center; }
  .transpose-row .label { font-size: 16px; color: #1a1a1a; text-align: center; font-weight: 700; }

  /* Panel d'édition : overlay centré (positionné en absolute par-dessus le layout) */
  .panel { background: #e6f1fb; border: 2px solid #378add; border-radius: 12px;
    padding: 12px; display: none;
    position: fixed; top: 200px; left: 10px;
    width: 440px;
    max-height: calc(100vh - 210px); overflow-y: auto;
    z-index: 10000; box-shadow: 0 6px 24px rgba(0,0,0,0.2); }
  .panel.open { display: block; }
  /* Backdrop discret : juste pour intercepter les clics hors panel sans masquer la partition */
  .panel-backdrop { display: none; position: fixed; inset: 0;
    background: transparent; z-index: 9999; pointer-events: none; }
  .abc-app:has(.panel.open) .panel-backdrop { display: block; }
  .panel .title-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px; }
  .panel .title { font-size: 26px; color: #0c447c; font-weight: 700; }
  .panel .title-mes { font-size: 22px; color: #185fa5; font-weight: 700; }
  .panel-nav { display: flex; align-items: center; gap: 8px; }
  .panel-nav .k { min-width: 36px; }
  .panel .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .panel input, .panel textarea { flex: 1; min-height: 44px; font-family: inherit;
    font-size: 20px; padding: 8px 12px; border: 2px solid #b4b2a9;
    border-radius: 8px; background: #ffffff; color: #1a1a1a; font-weight: 700; }
  .panel textarea { width: 100%; min-height: 120px; line-height: 1.3; }
  .panel .field-label { font-family: inherit; font-size: 20px;
    color: #0c447c; font-weight: 700; min-width: 70px; }
  .panel .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .panel .actions.three { grid-template-columns: 1fr 1fr 1fr; }
  .panel .actions.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .panel .actions .k { width: 100% !important; padding: 0 8px !important;
    height: 44px !important; font-size: 16px !important; }
  .panel .stepper { display: grid; grid-template-columns: 56px 1fr 56px;
    gap: 10px; align-items: center; margin-bottom: 6px; }
  .panel .stepper .k { height: 44px !important; font-size: 22px !important; padding: 0 !important; }
  .panel .stepper .val { text-align: center; font-family: inherit;
    font-size: 24px; color: #0c447c; font-weight: 700; }
  .panel .stepper-label { font-size: 16px; color: #1a1a1a; font-weight: 700; margin-bottom: 2px; text-align: center; }
  .panel small { display: block; color: #5f5e5a; font-size: 14px;
    margin-bottom: 8px; font-style: italic; font-weight: 600; }
  .panel .save-list { max-height: 320px; overflow-y: auto;
    border: 2px solid #b4b2a9; border-radius: 8px;
    background: #ffffff; margin-bottom: 10px; }
  .panel .save-list .item { padding: 10px 12px; border-bottom: 1px solid #ebe9e0;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 18px; cursor: pointer; font-weight: 700; }
  .panel .save-list .item:hover { background: #f0eee5; }
  .panel .save-list .item .del { color: #c34536; font-size: 22px; padding: 0 10px; cursor: pointer; font-weight: 700; }
  .panel .mes-active { font-size: 18px; color: #0c447c; font-weight: 700;
    background: #ffffff; padding: 10px; border-radius: 8px; border: 2px solid #b4b2a9;
    text-align: center; margin-bottom: 10px; }

  /* Accord */
  .chord-input { width: 100%; min-height: 44px; font-family: inherit;
    font-size: 22px; padding: 8px 12px; border: 2px solid #b4b2a9;
    border-radius: 8px; background: #ffffff; color: #1a1a1a; font-weight: 700;
    margin-bottom: 10px; text-align: center; }
  .chord-pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }
  .chord-pad .k { height: 40px !important; font-size: 16px !important; padding: 0 !important; }
</style>

<script>
(function(){
  const NOTES=[{label:'Do',sub:'C',n:'C'},{label:'Ré',sub:'D',n:'D'},{label:'Mi',sub:'E',n:'E'},{label:'Fa',sub:'F',n:'F'},{label:'Sol',sub:'G',n:'G'},{label:'La',sub:'A',n:'A'},{label:'Si',sub:'B',n:'B'}];
  const DURATIONS=[{label:'𝅝',d:4},{label:'𝅗𝅥',d:2},{label:'♩',d:1},{label:'♪',d:0.5},{label:'♬',d:0.25},{label:'𝅘𝅥𝅰',d:0.125}];
  const SHARP_NOTES=['F','C','G','D','A','E','B'];
  const FLAT_NOTES=['B','E','A','D','G','C','F'];
  const ORNAMENTS=[{code:'T',label:'tr'},{code:'M',label:'~M'},{code:'P',label:'pralle'},{code:'H',label:'fermata'},{code:'L',label:'accent'},{code:'.',label:'staccato'},{code:'u',label:'up'},{code:'v',label:'down'},{code:'O',label:'coda'}];
  // Boutons accord : ajoutent leur texte au champ
  const CHORD_BTNS=['#','b','m','Maj','2','4','5','6','7','9','11','13','sus','dim','aug','add','/'];
  const KEY_NAMES_MAJOR=['C','G','D','A','E','B','F♯','C♯'];
  const KEY_NAMES_MAJOR_FLAT=['C','F','B♭','E♭','A♭','D♭','G♭','C♭'];

  const state={headers:{X:'1',T:'',C:'',N:''},pieceMeter:'4/4',pieceUnit:'1/4',pieceKeySig:0,pieceClef:'treble',measures:[],sel:{m:0,s:0},octave:0,timeChanges:{},keyChanges:{},clefChanges:{},repeats:{},tempo:60,tempoDotted:false,volume:60,fullscreen:false,viewmode:true,activeTab:'notes',loop:false,scoreScale:80,openedFileName:null};

  const history={stack:[],pos:-1,max:100};
  function snapshot(){return JSON.stringify(state)}
  function pushHistory(){if(history.pos<history.stack.length-1)history.stack=history.stack.slice(0,history.pos+1);history.stack.push(snapshot());if(history.stack.length>history.max)history.stack.shift();history.pos=history.stack.length-1}
  function loadFrom(snap){const o=JSON.parse(snap);Object.assign(state,o)}
  function undo(){if(history.pos>0){history.pos--;loadFrom(history.stack[history.pos]);render()}}

  function renderScore(){

    const ch=sw?sw.clientHeight:400;
    const pxPerUnit=1.8*(state.scoreScale||100)/100;

      // Cle
      if(hC==='bass'){
        svg+='<text x="'+(LEFT_PAD-32)+'" y="'+(staffTop+2.6*LINE_GAP+5)+'" font-size="22" font-family="serif" fill="'+ink+'" opacity="0.85" text-anchor="middle">𝄢</text>';
      } else {
        svg+='<text x="'+(LEFT_PAD-32)+'" y="'+(staffTop+2.4*LINE_GAP+5)+'" font-size="26" font-family="serif" fill="'+ink+'" opacity="0.85" text-anchor="middle">𝄞</text>';
        if(hC==='treble8'){
          svg+='<text x="'+(LEFT_PAD-32)+'" y="'+(staffTop+4.6*LINE_GAP+5)+'" font-size="7" fill="'+ink+'" opacity="0.85" text-anchor="middle">8</text>';
        }
      }
      // Armure
      let kx=LEFT_PAD-16;
      keySigAccidentals(hK,hC).forEach(a=>{
        const ky=noteY(staffTop,a.step,hC)+4;
        svg+='<text x="'+kx+'" y="'+ky+'" font-size="12" font-family="serif" fill="'+ink+'">'+a.sym+'</text>';
        kx+=6;
      });
      // Metrique (uniquement sur la premiere ligne du document)
      if(isFirstDocLine){
        const{num,den}=parseMeter(hM);
        const mx=Math.max(kx+3,LEFT_PAD-10);
        svg+='<text x="'+mx+'" y="'+(staffTop+1.7*LINE_GAP+1)+'" font-size="12" font-family="serif" font-weight="bold" fill="'+ink+'" text-anchor="middle">'+num+'</text>';
        svg+='<text x="'+mx+'" y="'+(staffTop+3.6*LINE_GAP+1)+'" font-size="12" font-family="serif" font-weight="bold" fill="'+ink+'" text-anchor="middle">'+den+'</text>';
      }
      // === Calculer la largeur reelle de chaque mesure de la ligne (echelle par rapport au cout) ===
      const measureCosts=lineData.mIdxs.map(mi=>measureCost(mi));
      const headerC=lineHeaderCost(lsm,isFirstDocLine);
      const availableForMeasures=usableLineW-headerC+20; // recuperer la marge fixe deja comptee dans header
      const sumCosts=measureCosts.reduce((a,b)=>a+b,0)||1;
      // On n'etire jamais au-dela de la densite des lignes pleines : la derniere ligne incomplete
      // garde la meme echelle et reste alignee a gauche au lieu de s'etaler sur toute la largeur.
      const lineScale=Math.min(availableForMeasures/sumCosts, refScale);
      // Positions cumulatives de chaque mesure (xL,xR)
      const measureBounds=[];
      let curX=LEFT_PAD+headerC-20; // commence apres l'header (le 20 etait deja dans le cost de base)
      for(let i=0;i<lineData.mIdxs.length;i++){
        const w=measureCosts[i]*lineScale;
        measureBounds.push({xL:curX,xR:curX+w,measureW:w});
        curX+=w;
      }
      // Dessiner les barres de mesure
      for(let i=0;i<=lineData.mIdxs.length;i++){
        const x=(i===0)?measureBounds[0].xL:measureBounds[i-1].xR;
        svg+='<line x1="'+x+'" y1="'+staffTop+'" x2="'+x+'" y2="'+(staffTop+4*LINE_GAP)+'" stroke="'+ink+'" stroke-width="'+(i===0?1.1:0.7)+'" opacity="0.7"/>';
      }
      // Etat partage pour les liaisons traversant les mesures de la ligne
      let pS=null;
      const tP=[];
      let pendingIncomingTie=false;
      if(lsm>0){
        const prevM=state.measures[lsm-1];
        if(prevM){
          for(let k=prevM.length-1;k>=0;k--){
            const s=prevM[k];
            if(s.type==='note'){if(s.tieToNext)pendingIncomingTie=true;break}
          }
        }
      }
      for(let i=0;i<lineData.mIdxs.length;i++){
        const mIdx=lineData.mIdxs[i];
        if(state.measures[mIdx]===undefined)continue;
        const xL=measureBounds[i].xL;
        const xR=measureBounds[i].xR;
        const measureW=measureBounds[i].measureW;
        // Reprises et voltas
        const r=state.repeats[mIdx];
        if(r){
          if(r.start){
            svg+='<line x1="'+(xL+2)+'" y1="'+staffTop+'" x2="'+(xL+2)+'" y2="'+(staffTop+4*LINE_GAP)+'" stroke="'+ink+'" stroke-width="2"/>';
            svg+='<circle cx="'+(xL+6)+'" cy="'+(staffTop+1.5*LINE_GAP)+'" r="1.1" fill="'+ink+'"/>';
            svg+='<circle cx="'+(xL+6)+'" cy="'+(staffTop+2.5*LINE_GAP)+'" r="1.1" fill="'+ink+'"/>';
          }
          if(r.end){
            svg+='<circle cx="'+(xR-6)+'" cy="'+(staffTop+1.5*LINE_GAP)+'" r="1.1" fill="'+ink+'"/>';
            svg+='<circle cx="'+(xR-6)+'" cy="'+(staffTop+2.5*LINE_GAP)+'" r="1.1" fill="'+ink+'"/>';
            svg+='<line x1="'+(xR-2)+'" y1="'+staffTop+'" x2="'+(xR-2)+'" y2="'+(staffTop+4*LINE_GAP)+'" stroke="'+ink+'" stroke-width="2"/>';
          }
          if(r.volta){
            const yV=staffTop-11;
            svg+='<line x1="'+(xL+2)+'" y1="'+yV+'" x2="'+(xR-2)+'" y2="'+yV+'" stroke="'+ink+'" stroke-width="0.8"/>';
            svg+='<line x1="'+(xL+2)+'" y1="'+yV+'" x2="'+(xL+2)+'" y2="'+(yV+4)+'" stroke="'+ink+'" stroke-width="0.8"/>';
            svg+='<text x="'+(xL+5)+'" y="'+(yV+6)+'" font-size="8" fill="'+ink+'" font-weight="bold">'+r.volta+'.</text>';
          }
        }
        const m=state.measures[mIdx];
        const lC=clefAt(mIdx),lM=meterAt(mIdx);
        let changeOffset=0;
        let rightInset=0;
        // Reprise gauche : prendre en compte la place des points/barre epaisse
        if(r&&r.start)changeOffset=Math.max(changeOffset,6);
        // Reprise droite : reduire l'espace utile a droite
        if(r&&r.end)rightInset=8;
        if(i>0){
          const prevClef=clefAt(mIdx-1);
          const prevKey=keyAt(mIdx-1);
          const prevMeter=meterAt(mIdx-1);
          const hasClefChange=lC!==prevClef;
          const hasKeyChange=keyAt(mIdx)!==prevKey;
          const hasMeterChange=lM!==prevMeter;
          if(hasClefChange||hasKeyChange||hasMeterChange){
            let cx=xL+3+changeOffset;
            // Cle (en premier, juste apres la barre)
            if(hasClefChange){
              cx+=6;
              if(lC==='bass'){
                svg+='<text x="'+cx+'" y="'+(staffTop+2.6*LINE_GAP+5)+'" font-size="22" font-family="serif" fill="'+ink+'" opacity="0.85" text-anchor="middle">𝄢</text>';
              } else {
                svg+='<text x="'+cx+'" y="'+(staffTop+2.4*LINE_GAP+5)+'" font-size="26" font-family="serif" fill="'+ink+'" opacity="0.85" text-anchor="middle">𝄞</text>';
                if(lC==='treble8')svg+='<text x="'+(cx+3)+'" y="'+(staffTop+4.6*LINE_GAP+5)+'" font-size="7" fill="'+ink+'" opacity="0.85" text-anchor="middle">8</text>';
              }
              cx+=10;
            }
            // Armure
            if(hasKeyChange){
              if(hasClefChange)cx+=2;
              const accs=keySigAccidentals(keyAt(mIdx),lC);
              accs.forEach(a=>{
                const ky=noteY(staffTop,a.step,lC)+4;
                svg+='<text x="'+cx+'" y="'+ky+'" font-size="12" font-family="serif" fill="'+ink+'">'+a.sym+'</text>';
                cx+=7;
              });
              cx+=3;
            }
            // Rythme
            if(hasMeterChange){
              if(hasClefChange||hasKeyChange)cx+=3;
              const{num,den}=parseMeter(lM);
              cx+=5;
              svg+='<text x="'+cx+'" y="'+(staffTop+1.7*LINE_GAP+1)+'" font-size="12" font-family="serif" font-weight="bold" fill="'+ink+'" text-anchor="middle">'+num+'</text>';
              svg+='<text x="'+cx+'" y="'+(staffTop+3.6*LINE_GAP+1)+'" font-size="12" font-family="serif" font-weight="bold" fill="'+ink+'" text-anchor="middle">'+den+'</text>';
              cx+=9;
            }
            // Marge supplementaire avant la premiere note
            cx+=4;
            // Espace consomme depuis xL
            changeOffset=cx-xL;
          }
        }
        const x0=xL+6+changeOffset;
        const usableW=measureW-10-changeOffset-rightInset;
        // Largeur ideale par slot : 10 unites pour une note normale, 14 unites si elle a une alteration
        const slotWidth=m.map((slot,si)=>{
          if(slot.type!=='note')return 10;
          const accD=accToDrawFor(m,si,keyAt(mIdx));
          return accD?14:10;
        });
        const sumW=slotWidth.reduce((a,b)=>a+b,0)||1;
        // Mise a l'echelle : compresse ou dilate pour remplir exactement usableW
        const scale=usableW/sumW;
        // Position cumulative : centre de chaque slot au milieu de sa largeur (apres scale)
        const cxBySlot=new Array(m.length);
        const wBySlot=new Array(m.length);
        let cum=0;
        for(let si=0;si<m.length;si++){
          const w=slotWidth[si]*scale;
          cxBySlot[si]=x0+cum+w/2;
          wBySlot[si]=w;
          cum+=w;
        }
        // sW de reference (utilise pour les boites de selection)
        const sW=usableW/Math.max(m.length,1);
        const bg=computeBeamGroups(m,lM);
        const sTG={};
        bg.forEach((g,gi)=>{g.forEach(si=>sTG[si]={gIdx:gi,group:g})});
        const mS=clefRefStep(lC)+4;
        const gSD=bg.map(g=>{
          let s=0;
          for(const idx of g){const t=m[idx];s+=stepIndex(t.note,t.octave)}
          return(s/g.length)<mS?'up':'down';
        });
        const gBD=bg.map((g,gi)=>{
          const su=gSD[gi]==='up';
          let eY=su?Infinity:-Infinity;
          const sX=[];
          g.forEach(si=>{
            const t=m[si];
            const cx=cxBySlot[si];
            const sx=su?cx+3.3:cx-3.3;
            const hY=noteY(staffTop,stepIndex(t.note,t.octave),lC);
            const nT=su?hY-19:hY+19;
            if(su)eY=Math.min(eY,nT);else eY=Math.max(eY,nT);
            sX.push({slotIdx:si,sx,headY:hY});
          });
          return{stemUp:su,beamY:eY,stems:sX};
        });
        m.forEach((t,si)=>{
          const cx=cxBySlot[si];
          // Rectangle cliquable invisible sur toute la zone du slot (selection par clic)
          svg+='<rect x="'+(cx-wBySlot[si]/2)+'" y="'+staffTop+'" width="'+wBySlot[si]+'" height="'+(4*LINE_GAP+20)+'" fill="transparent" pointer-events="all" data-m="'+mIdx+'" data-s="'+si+'" style="cursor:pointer"/>';
          const iS=(mIdx===selM&&si===state.sel.s);
          const cl=iS?sel:ink;
          if(t.chord)svg+='<text x="'+cx+'" y="'+(staffTop-3)+'" font-size="9" font-weight="bold" fill="'+ink+'" text-anchor="middle">'+t.chord+'</text>';
          if(t.orn&&t.orn.length){
            const ot=t.orn.map(o=>{if(o==='T')return'tr';if(o==='M')return'∼';if(o==='H')return'𝄐';if(o==='.')return'·';if(o==='L')return'>';return o}).join(' ');
            svg+='<text x="'+cx+'" y="'+(staffTop-12)+'" font-size="8" font-style="italic" fill="'+ink+'" text-anchor="middle">'+ot+'</text>';
          }
          if(t.type==='note'){
            const gp=sTG[si];
            if(gp){
              const gi=gp.gIdx;
              const su=gSD[gi]==='up';
              const bY=gBD[gi].beamY;
              const dr=drawNoteHead(t,cx,cl,lC,false,su,staffTop,accToDrawFor(m,si,keyAt(mIdx)));
              const sx=dr.stemX,hY=dr.headY;
              svg+=dr.svg;
              svg+='<line x1="'+sx+'" y1="'+hY+'" x2="'+sx+'" y2="'+bY+'" stroke="'+cl+'" stroke-width="0.8"/>';
              if(iS)svg+='<circle cx="'+cx+'" cy="'+dr.headY+'" r="8" fill="none" stroke="'+sel+'" stroke-width="0.7" opacity="0.4"/>';
              if(pS&&pS.t.tieToNext)tP.push({fromCx:pS.cx,fromY:pS.y,toCx:cx,toY:dr.headY});
              if(pendingIncomingTie){tP.push({fromCx:LEFT_PAD-6,fromY:dr.headY,toCx:cx,toY:dr.headY,partial:'in'});pendingIncomingTie=false}
              pS={t,cx,y:dr.headY};
            } else {
              const st=stepIndex(t.note,t.octave);
              const su=st<mS;
              const dr=drawNoteHead(t,cx,cl,lC,true,su,staffTop,accToDrawFor(m,si,keyAt(mIdx)));
              svg+=dr.svg;
              if(iS)svg+='<circle cx="'+cx+'" cy="'+dr.headY+'" r="8" fill="none" stroke="'+sel+'" stroke-width="0.7" opacity="0.4"/>';
              if(pS&&pS.t.tieToNext)tP.push({fromCx:pS.cx,fromY:pS.y,toCx:cx,toY:dr.headY});
              if(pendingIncomingTie){tP.push({fromCx:LEFT_PAD-6,fromY:dr.headY,toCx:cx,toY:dr.headY,partial:'in'});pendingIncomingTie=false}
              pS={t,cx,y:dr.headY};
            }
          } else {
            const dr=drawRest(t,cx,cl,staffTop);
            svg+=dr.svg;
            if(iS)svg+='<circle cx="'+cx+'" cy="'+dr.headY+'" r="8" fill="none" stroke="'+sel+'" stroke-width="0.7" opacity="0.4"/>';
            // Silences cassent les liaisons
            pS=null;
          }
          if(t.tuplet&&(si===0||!m[si-1]||!m[si-1].tuplet||m[si-1].tupletId!==t.tupletId)){
            const gs=[];
            for(let j=si;j<m.length&&m[j].tupletId===t.tupletId&&gs.length<t.tuplet;j++)gs.push(j);
            if(gs.length>0){
              const cF=x0+gs[0]*sW+sW/2;
              const cL=x0+gs[gs.length-1]*sW+sW/2;
              const cM=(cF+cL)/2;
              // Crochet du n-uplet (au-dessus de la portee)
              const yT=staffTop-6;
              svg+='<line x1="'+cF+'" y1="'+yT+'" x2="'+cL+'" y2="'+yT+'" stroke="'+ink+'" stroke-width="0.7"/>';
              svg+='<line x1="'+cF+'" y1="'+yT+'" x2="'+cF+'" y2="'+(yT+3)+'" stroke="'+ink+'" stroke-width="0.7"/>';
              svg+='<line x1="'+cL+'" y1="'+yT+'" x2="'+cL+'" y2="'+(yT+3)+'" stroke="'+ink+'" stroke-width="0.7"/>';
              svg+='<text x="'+cM+'" y="'+(yT-1)+'" font-size="8" font-style="italic" fill="'+ink+'" text-anchor="middle" font-weight="bold">'+t.tuplet+'</text>';
            }
          }
          if(si===0){
            svg+='<text x="'+(xL+2)+'" y="'+(staffTop-3)+'" font-size="8" fill="'+dim+'">'+String(mIdx+1)+'</text>';
          }
          // Zone cliquable invisible pour selectionner ce slot
          svg+='<rect x="'+(cx-sW/2)+'" y="'+(staffTop-12)+'" width="'+sW+'" height="'+(LINE_GAP*4+24)+'" fill="transparent" style="cursor:pointer" data-m="'+mIdx+'" data-s="'+si+'"/>';
        });
        // Beams pour cette mesure : niveau 1 complet, niveaux 2/3 partiels selon notes
        bg.forEach((g,gi)=>{
          const d=gBD[gi];const su=d.stemUp;const bY=d.beamY;const sts=d.stems;
          const bT=2.5;
          const dyO=su?bT+0.8:-(bT+0.8);
          // Niveau de chaque note du groupe (1=croche, 2=double, 3=triple)
          // On utilise la duree de base (sans point ni n-uplet) pour decider le nombre de barres
          const lvls=g.map(idx=>{
            const bD=m[idx].dur;
            if(bD<=0.125+1e-6)return 3;
            if(bD<=0.25+1e-6)return 2;
            return 1;
          });
          // sX = position x de chaque hampe (ordre = ordre du groupe)
          const xPos=sts.map(s=>s.sx);
          const xS=xPos[0],xE=xPos[xPos.length-1];
          // Barre principale (niveau 1) : toute la largeur du groupe
          {
            const yy=bY;
            svg+='<rect x="'+xS+'" y="'+(yy-bT/2)+'" width="'+(xE-xS)+'" height="'+bT+'" fill="'+ink+'"/>';
          }
          // Niveaux 2 et 3 : segments entre notes consecutives de meme niveau, demi-barres pour les isolees
          for(let lvl=2;lvl<=3;lvl++){
            const yy=bY+(lvl-1)*dyO;
            // 1) Segments connectes : entre i et i+1 si les deux ont niveau >= lvl
            const connected=new Array(xPos.length).fill(false);
            for(let i=0;i<xPos.length-1;i++){
              if(lvls[i]>=lvl&&lvls[i+1]>=lvl){
                svg+='<rect x="'+xPos[i]+'" y="'+(yy-bT/2)+'" width="'+(xPos[i+1]-xPos[i])+'" height="'+bT+'" fill="'+ink+'"/>';
                connected[i]=true;connected[i+1]=true;
              }
            }
            // 2) Demi-barres pour les notes de niveau >= lvl qui ne sont pas connectees
            for(let i=0;i<xPos.length;i++){
              if(lvls[i]>=lvl&&!connected[i]){
                // Longueur de demi-barre : ~40% de la distance au voisin du meme groupe
                let halfLen;
                if(i===0){
                  // Demi-barre vers la droite
                  halfLen=Math.max(3,(xPos[1]-xPos[0])*0.4);
                  svg+='<rect x="'+xPos[i]+'" y="'+(yy-bT/2)+'" width="'+halfLen+'" height="'+bT+'" fill="'+ink+'"/>';
                } else {
                  // Demi-barre vers la gauche
                  halfLen=Math.max(3,(xPos[i]-xPos[i-1])*0.4);
                  svg+='<rect x="'+(xPos[i]-halfLen)+'" y="'+(yy-bT/2)+'" width="'+halfLen+'" height="'+bT+'" fill="'+ink+'"/>';
                }
              }
            }
          }
        });
      }
      // Liaison sortante : si la derniere note de la ligne a tieToNext
      if(pS&&pS.t.tieToNext){
        tP.push({fromCx:pS.cx,fromY:pS.y,toCx:SCORE_W-RIGHT_PAD+4,toY:pS.y,partial:'out'});
      }
      // Dessiner toutes les liaisons de la ligne (apres avoir parcouru toutes les mesures)
      tP.forEach(tp=>{
        const cx=(tp.fromCx+tp.toCx)/2;
        const cy=((tp.fromY+tp.toY)/2)+6;
        svg+='<path d="M '+(tp.fromCx+3)+' '+(tp.fromY+3)+' Q '+cx+' '+cy+' '+(tp.toCx-3)+' '+(tp.toY+3)+'" stroke="'+ink+'" stroke-width="0.9" fill="none"/>';
      });
    }
    svg+='</svg>';
    document.getElementById('score').innerHTML=svg;
  }

  function selectedSlot(){const m=state.measures[state.sel.m];return m?(m[state.sel.s]||null):null}
  function renderState(){
    document.getElementById('meas-pos').textContent=state.sel.m+1;
    document.getElementById('slot-pos').textContent=state.sel.s+1;
    document.getElementById('info-meter').textContent=meterAt(state.sel.m);
    document.getElementById('info-key').textContent=keyHumanLabel(keyAt(state.sel.m));
    document.getElementById('info-clef').textContent=clefHumanLabel(clefAt(state.sel.m));
    document.getElementById('oct-val').textContent=state.octave>0?'+'+state.octave:state.octave;
    const sl=selectedSlot();
    document.querySelectorAll('[data-dur]').forEach(b=>{const aD=sl?sl.dur:1;b.classList.toggle('active',parseFloat(b.dataset.dur)===aD)});
    // Bleuter le bouton note correspondant a la note active
    document.querySelectorAll('[data-note]').forEach(b=>{const aN=(sl&&sl.type==='note')?sl.note:null;b.classList.toggle('active',b.dataset.note===aN)});
    document.querySelectorAll('[data-acc]').forEach(b=>{
      let aA=(sl&&sl.type==='note')?(sl.acc||''):'';
      // Si la note appartient à l'armure (sans alteration explicite), afficher le bouton actif
      if(sl&&sl.type==='note'&&!aA){
        const sig=keyAt(state.sel.m);
        if(sig>0&&SHARP_NOTES.slice(0,sig).includes(sl.note))aA='^';
        else if(sig<0&&FLAT_NOTES.slice(0,-sig).includes(sl.note))aA='_';
      }
      b.classList.toggle('active',aA===b.dataset.acc&&b.dataset.acc!=='')
    });
    const dB=document.getElementById('dot-btn');if(dB)dB.classList.toggle('active',!!(sl&&sl.dot));
    document.getElementById('tempo-v').textContent=state.tempo;
    document.getElementById('tempo-v-dot').textContent=Math.round(state.tempo*2/3);
    document.getElementById('tempo-mode-q').classList.toggle('active',!state.tempoDotted);
    document.getElementById('tempo-mode-qd').classList.toggle('active',!!state.tempoDotted);
    document.getElementById('vol-v').textContent=state.volume;
    document.getElementById('size-v').textContent=state.scoreScale||100;
    document.getElementById('btn-play').textContent=audio.playing?'⏸':'▶';
    document.getElementById('btn-loop').classList.toggle('active',!!state.loop);
    document.getElementById('btn-undo').disabled=(history.pos<=0);
    document.getElementById('btn-redo').disabled=(history.pos>=history.stack.length-1);
    const um=document.getElementById('btn-undo-mes');if(um)um.disabled=(history.pos<=0);
    const rm=document.getElementById('btn-redo-mes');if(rm)rm.disabled=(history.pos>=history.stack.length-1);
    updatePasteButton();
    // Point 8 : bouton n-uplet en bleu si le slot actif est dans un n-uplet
    const sl0=selectedSlot();
    const tb=document.getElementById('btn-tuplet');
    if(tb)tb.classList.toggle('active', !!(sl0&&sl0.tuplet));
    // Point 2 : bouton liaison en bleu si la note active a un tieToNext
    const tieBtn=document.getElementById('btn-tie');
    if(tieBtn)tieBtn.classList.toggle('active', !!(sl0&&sl0.type==='note'&&sl0.tieToNext));
    // Boutons reprises et voltas en bleu selon l'etat de la mesure active
    const rA=state.repeats[state.sel.m];
    const repS=document.getElementById('btn-rep-start');
    if(repS)repS.classList.toggle('active', !!(rA&&rA.start));
    const repE=document.getElementById('btn-rep-end');
    if(repE)repE.classList.toggle('active', !!(rA&&rA.end));
    const v1=document.getElementById('btn-volta1');
    if(v1)v1.classList.toggle('active', !!(rA&&rA.volta===1));
    const v2=document.getElementById('btn-volta2');
    if(v2)v2.classList.toggle('active', !!(rA&&rA.volta===2));
    const vmBtn=document.getElementById('btn-viewmode');if(vmBtn)vmBtn.textContent=state.viewmode?'✎':'👁';
    document.getElementById('hdr-x-val').textContent=state.headers.X||'0';
    document.getElementById('hdr-t-val').textContent=(state.headers.T||'—').split('\n')[0];
    document.getElementById('hdr-c-val').textContent=(state.headers.C||'—').split('\n')[0];
    document.getElementById('hdr-n-val').textContent=(state.headers.N||'—').split('\n')[0];
  }
  function render(){renderScore();renderState();notifyPanelMeasureChanged();if(typeof updateBadge==='function')updateBadge()}

  function selectNext(){

  const audio={ctx:null,master:null,playing:false,scheduled:[],stopAt:0,raf:null,loopFrom:null};
  function ensureAudio(){if(!audio.ctx){audio.ctx=new(window.AudioContext||window.webkitAudioContext)();audio.master=audio.ctx.createGain();audio.master.connect(audio.ctx.destination)}audio.master.gain.value=state.volume/200;if(audio.ctx.state==='suspended')audio.ctx.resume()}
  function midiOfNote(note,oct,acc,keySig){const bs={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[note];let midi=60+bs+oct*12;let alt=0;if(acc==='^')alt=1;else if(acc==='_')alt=-1;else if(acc==='=')alt=0;else{if(keySig>0&&SHARP_NOTES.slice(0,keySig).includes(note))alt=1;else if(keySig<0&&FLAT_NOTES.slice(0,-keySig).includes(note))alt=-1}return midi+alt}
  function freqOfMidi(m){return 440*Math.pow(2,(m-69)/12)}
  function previewNote(midi,durSec=0.25){ensureAudio();const t=audio.ctx.currentTime+0.005;const f=freqOfMidi(midi);const o=audio.ctx.createOscillator();const g=audio.ctx.createGain();o.type='triangle';o.frequency.value=f;const p=0.5,a=0.005;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.setValueAtTime(p,t+Math.max(durSec-0.06,a));g.gain.linearRampToValueAtTime(0,t+durSec);o.connect(g);g.connect(audio.master);o.start(t);o.stop(t+durSec+0.03)}
  function playSchedule(){
    ensureAudio();stopPlayback(false);audio.playing=true;
    document.getElementById('btn-play').textContent='⏸';
    const st=audio.ctx.currentTime+0.05;
    const qD=60/state.tempo;
    const order=expandForPlayback();
    if(order.length===0){stopPlayback(true);return}
    const startMeasure=state.sel.m,startSlot=state.sel.s;
    if(!audio.loopFrom)audio.loopFrom={m:startMeasure,s:startSlot};
    let startIdxInOrder=order.indexOf(startMeasure);
    if(startIdxInOrder<0)startIdxInOrder=0;
    // Construire la liste complete des events (sans creer les oscillateurs)
    const events=[];
    for(let oi=startIdxInOrder;oi<order.length;oi++){
      const mi=order[oi];
      const m=state.measures[mi];if(!m)continue;
      const sig=keyAt(mi);
      const firstSlot=(oi===startIdxInOrder&&mi===startMeasure)?startSlot:0;
      for(let si=firstSlot;si<m.length;si++){
        const slot=m[si];
        const dur=effDur(slot)*qD;
        if(slot.type==='note'){
          const midi=midiOfNote(slot.note,slot.octave,effectiveAcc(m,si,sig),sig);
          events.push({midi,dur,measureIdx:mi,slotIdx:si,tieToNext:!!slot.tieToNext});
        } else {
          events.push({midi:null,dur,measureIdx:mi,slotIdx:si,tieToNext:false});
        }
      }
    }
    // Fusionner les notes liees de meme hauteur
    let i=0;
    while(i<events.length){
      const ev=events[i];
      if(ev.midi!==null&&ev.tieToNext){
        let j=i+1;
        while(j<events.length&&events[j].midi===ev.midi){
          ev.dur+=events[j].dur;
          events[j].silent=true;
          events[j].dur=0;
          if(!events[j].tieToNext)break;
          j++;
        }
      }
      i++;
    }
    // Pre-calculer le temps absolu de chaque event
    let acc=st;
    events.forEach(ev=>{ev.startAt=acc;acc+=ev.dur});
    audio.stopAt=acc;
    audio.events=events;
    audio.eventIdx=0;
    // Planifier la fenetre initiale (environ 3s d'avance)
    const SCHEDULE_AHEAD=3.0;
    function scheduleAhead(){
      const now=audio.ctx.currentTime;
      const horizon=now+SCHEDULE_AHEAD;
      while(audio.eventIdx<audio.events.length){
        const ev=audio.events[audio.eventIdx];
        if(ev.startAt>horizon)break;
        if(ev.midi!==null&&!ev.silent&&ev.dur>0){
          const o=audio.ctx.createOscillator();
          const g=audio.ctx.createGain();
          o.type='triangle';o.frequency.value=freqOfMidi(ev.midi);
          const a=0.005,r=Math.min(0.05,ev.dur*0.3);
          g.gain.setValueAtTime(0,ev.startAt);
          g.gain.linearRampToValueAtTime(0.5,ev.startAt+a);
          g.gain.setValueAtTime(0.5,ev.startAt+ev.dur-r);
          g.gain.linearRampToValueAtTime(0,ev.startAt+ev.dur);
          o.connect(g);g.connect(audio.master);
          o.start(ev.startAt);o.stop(ev.startAt+ev.dur+0.02);
          audio.scheduled.push(o);
        }
        // Marqueur de progression
        audio.scheduled.push({updateAt:ev.startAt,measureIdx:ev.measureIdx,slotIdx:ev.slotIdx});
        audio.eventIdx++;
      }
    }
    scheduleAhead();
    function tick(){
      if(!audio.playing)return;
      const now=audio.ctx.currentTime;
      // Planifier les events a venir si on approche du dernier planifie
      scheduleAhead();
      // Nettoyer les oscillateurs deja joues (pour ne pas accumuler la memoire)
      audio.scheduled=audio.scheduled.filter(ev=>{
        if(ev.stop)return ev.startTimeAbs===undefined||ev.startTimeAbs+0.5>now;
        // garder marqueurs updateAt encore utiles
        return ev.updateAt===undefined||ev.updateAt>now-1;
      });
      // Trouver le dernier marqueur passe pour mettre a jour la selection
      let last=null;
      for(const ev of audio.scheduled){
        if(ev.updateAt!==undefined&&ev.updateAt<=now)last=ev;
        if(ev.updateAt!==undefined&&ev.updateAt>now)break;
      }
      if(last&&(state.sel.m!==last.measureIdx||state.sel.s!==last.slotIdx)){
        state.sel={m:last.measureIdx,s:last.slotIdx};renderScore();renderState();
      }
      if(now>=audio.stopAt){
        if(state.loop&&audio.loopFrom){
          state.sel={m:audio.loopFrom.m,s:audio.loopFrom.s};
          stopPlayback(false);
          playSchedule();
          return;
        }
        stopPlayback(true);return
      }
      audio.raf=requestAnimationFrame(tick);
    }
    audio.raf=requestAnimationFrame(tick);
  }
  function stopPlayback(refresh){if(audio.raf){cancelAnimationFrame(audio.raf);audio.raf=null}audio.scheduled.forEach(ev=>{if(ev.stop)try{ev.stop()}catch(_){}});audio.scheduled=[];audio.playing=false;document.getElementById('btn-play').textContent='▶';if(refresh){audio.loopFrom=null;render()}}

  function setNoteAtSelection(n){
    const sl=selectedSlot();if(!sl)return;const dur=sl.dur,dot=sl.dot;
    // Conserver l'alteration seulement si on garde la meme note (nom)
    let acc='';
    if(sl.type==='note'&&sl.note===n)acc=sl.acc||'';
    // Point 7 : trouver la note précédente (toute mesure) et choisir l'octave la plus proche
    const prev=findPreviousNote(state.sel.m,state.sel.s);
    if(prev){
      const baseSemi={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
      const prevMidi=60+baseSemi[prev.note]+prev.octave*12+(prev.acc==='^'?1:prev.acc==='_'?-1:0);
      let best=state.octave,bestDist=Infinity;
      for(let o=-2;o<=3;o++){
        const m=60+baseSemi[n]+o*12;
        const d=Math.abs(m-prevMidi);
        if(d<bestDist){bestDist=d;best=o}
      }
      state.octave=best;
    }
    const hadTie=!!sl.tieToNext;
    const newSlot={type:'note',note:n,octave:state.octave,dur,dot,acc};
    if(hadTie)newSlot.tieToNext=true;
    // Conserver l'appartenance au triolet
    if(sl.tuplet){newSlot.tuplet=sl.tuplet;newSlot.tupletId=sl.tupletId}
    state.measures[state.sel.m][state.sel.s]=newSlot;
    propagateTieReplacement(state.sel.m,state.sel.s,n,state.octave,acc);
    pushHistory();
    const midi=midiOfNote(n,state.octave,acc,keyAt(state.sel.m));previewNote(midi);
    render();
  }
  function findPreviousNote(mi,si){
    // Cherche en arrière dans la mesure courante puis dans les mesures précédentes
    for(let i=si-1;i>=0;i--){
      const s=state.measures[mi][i];
      if(s.type==='note')return s;
    }
    for(let m=mi-1;m>=0;m--){
      const meas=state.measures[m];
      for(let i=meas.length-1;i>=0;i--){
        const s=meas[i];
        if(s.type==='note')return s;
      }
    }
    return null;
  }
  function propagateTieReplacement(mi,si,note,octave,acc){
    let curM=mi,curS=si;
    while(true){
      const meas=state.measures[curM];
      if(!meas)break;
      const cur=meas[curS];
      if(!cur||!cur.tieToNext)break;
      let nextM=curM,nextS=curS+1;
      if(nextS>=meas.length){
        nextM=curM+1;nextS=0;
        if(nextM>=state.measures.length)break;
      }
      const next=state.measures[nextM][nextS];
      if(!next||next.type!=='note')break;
      next.note=note;next.octave=octave;next.acc=acc;
      curM=nextM;curS=nextS;
    }
  }

  let nextTupletId=1;
  function applyTuplet(n,unitDur){
    // n-uplet de unitDur occupe l'espace de (n-1) notes de unitDur (règle 3:2 → 3 notes dans l'espace de 2)
    // Plus généralement : selon ratio implicite ABC (n:2 pour n impair, n:3 pour 6, etc.) — on garde 3:2 simple
    const ratio=2; // 3:2 → l'espace est de 2 unitDur
    const totalSpace=ratio*unitDur;
    const m=state.measures[state.sel.m];
    const idx=state.sel.s;
    const meter=meterAt(state.sel.m);
    const{den}=parseMeter(meter);
    const beat=4/den;
    const cap=measureCapacity(meter);
    // Calculer la position courante (offset)
    let offset=0;for(let i=0;i<idx;i++)offset+=effDur(m[i]);
    // Si l'espace disponible jusqu'à fin de mesure < totalSpace, on tronque (on garde le bouton désactivé sinon)
    const available=cap-offset;
    if(available<totalSpace-1e-6){alert('Pas assez de place dans la mesure pour ce n-uplet');return}
    // Identifiant unique pour ce groupe de n-uplet
    const tid=nextTupletId++;
    const activeSlot=m[idx];
    const isRest=(activeSlot.type==='rest');
    const newSlots=[];
    for(let i=0;i<n;i++){
      if(i===0){
        if(isRest){newSlots.push({type:'rest',dur:unitDur,dot:false,tuplet:n,tupletId:tid})}
        else{
          newSlots.push({type:'note',note:activeSlot.note,octave:activeSlot.octave,dur:unitDur,dot:false,acc:activeSlot.acc||'',tuplet:n,tupletId:tid});
        }
      } else {
        newSlots.push({type:'rest',dur:unitDur,dot:false,tuplet:n,tupletId:tid});
      }
    }
    // Consommer totalSpace à partir de idx (effacer/raccourcir les slots existants)
    let consumed=0;
    let cursor=idx;
    const eps=1e-6;
    while(consumed<totalSpace-eps&&cursor<m.length){
      const s=m[cursor];
      const d=effDur(s);
      if(consumed+d<=totalSpace+eps){
        consumed+=d;
        m.splice(cursor,1);
      } else {
        // découper le slot en deux : ce qu'on consomme + ce qui reste
        const remaining=d-(totalSpace-consumed);
        // remplacer ce slot par un silence (ou la note tronquée) à la durée restante
        const offsetAfter=offset+totalSpace;
        const pieces=splitDurationByBeat(offsetAfter,remaining,beat);
        const tail=pieces.map(p=>Object.assign({},s,{dur:p.dur,dot:p.dot}));
        m.splice(cursor,1,...tail);
        consumed=totalSpace;
        break;
      }
    }
    // Insérer les nouveaux slots à idx
    m.splice(idx,0,...newSlots);
    // Truncate/compléter la mesure
    truncateMeasureToCapacity(state.sel.m,cap);
    pushHistory();render();
  }

  // === Transformations rythmiques globales (toute la partition) ===
  function slotOffsets(meas){
    const offs=[];let cur=0;
    for(let i=0;i<meas.length;i++){offs.push(cur);cur+=effDur(meas[i])}
    return offs;
  }
  function onBeat(o,beat){const eps=1e-6;const r=o%beat;return r<eps||Math.abs(r-beat)<eps}
  function applySwingGlobal(matchFn,transformFn,labelForAlert){
    let count=0;
    state.measures.forEach((meas,mi)=>{
      const beat=4/parseMeter(meterAt(mi)).den;
      let i=0;
      while(i<meas.length-1){
        const offs=slotOffsets(meas);
        if(onBeat(offs[i],beat)&&matchFn(meas,i,beat)){
          transformFn(meas,i,beat);
          count++;
          i+=2;continue;
        }
        i++;
      }
    });
    if(count===0){alert(labelForAlert+' : aucune occurrence trouvee');return false}
    pushHistory();render();return true;
  }
  function matchEqualPair(meas,i,beat){
    if(i>=meas.length-1)return false;
    const a=meas[i],b=meas[i+1];
    if(a.tuplet||b.tuplet)return false;
    if(a.dot||b.dot)return false;
    if(Math.abs(a.dur-b.dur)>1e-6)return false;
    if(Math.abs(2*a.dur-beat)>1e-6)return false;
    return true;
  }
  document.getElementById('btn-swing-dot').addEventListener('click',()=>{
    applySwingGlobal(matchEqualPair,(meas,i)=>{
      const a=meas[i],b=meas[i+1];
      meas[i]={...a,dur:a.dur,dot:true};

  document.getElementById('btn-swing-triplet').addEventListener('click',()=>{

      meas[i+1]={...b,dur:b.dur,dot:false,tuplet:3,tupletId:tid};

  function matchDotPair(meas,i,beat){
    if(i>=meas.length-1)return false;
    const a=meas[i],b=meas[i+1];
    if(a.tuplet||b.tuplet)return false;
    if(!a.dot||b.dot)return false;
    if(Math.abs(b.dur-a.dur/2)>1e-6)return false;

  function matchTripletPair(meas,i,beat){
    if(i>=meas.length-1)return false;
    const a=meas[i],b=meas[i+1];
    if(a.tuplet!==3||b.tuplet!==3||a.tupletId!==b.tupletId)return false;
    if(Math.abs(a.dur-2*b.dur)>1e-6)return false;

  // === Materialisation des alterations implicites avant un decalage ===
  function materializeAccidentals(){
    state.measures.forEach((meas,mi)=>{
      const sig=keyAt(mi);
      meas.forEach((slot,si)=>{
        if(slot.type!=='note')return;
        if(slot.acc)return;
        let priorAcc=null;
        for(let k=si-1;k>=0;k--){
          const p=meas[k];
          if(p.type==='note'&&p.note===slot.note&&p.octave===slot.octave&&p.acc){priorAcc=p.acc;break}
        }
        if(priorAcc!==null){slot.acc=priorAcc;return}
        if(sig>0&&SHARP_NOTES.slice(0,sig).includes(slot.note))slot.acc='^';
        else if(sig<0&&FLAT_NOTES.slice(0,-sig).includes(slot.note))slot.acc='_';
      });
    });
  }

  // === Decalage global du morceau a partir de la note selectionnee ===
  function flattenSlots(){
    const out=[]; let absSel=-1;
    state.measures.forEach((m,mi)=>{
      m.forEach((sl,si)=>{
        if(mi===state.sel.m&&si===state.sel.s)absSel=out.length;
        out.push({slot:sl,mIdx:mi,sIdx:si});
      });
    });
    const caps=state.measures.map((_,mi)=>measureCapacity(meterAt(mi)));
    return{slots:out,absSel,caps};
  }
  function rebuildMeasuresFromSlots(slots,caps){
    const result=[];
    let mi=0,used=0,curM=[];
    const eps=1e-6;
    function splitSlot(sl,want){
      const e=effDur(sl);
      if(want>=e-eps)return[sl,null];
      if(!sl.tuplet&&!sl.dot){
        const head={...sl,dur:want};
        const tail={...sl,dur:e-want,dot:false};
        if(sl.type==='note'){
          head.tieToNext=true;
          if(!sl.tieToNext)delete tail.tieToNext;
        }
        return[head,tail];
      }
      if(sl.dot&&!sl.tuplet){
        const head={...sl,dur:want,dot:false};
        const tail={...sl,dur:e-want,dot:false};
        if(sl.type==='note'){
          head.tieToNext=true;
          if(!sl.tieToNext)delete tail.tieToNext;
        }
        return[head,tail];
      }
      return[sl,null];
    }
    for(const item of slots){
      let sl=item.slot;
      while(sl){
        if(mi>=caps.length){sl=null;break;}
        const cap=caps[mi];
        const remain=cap-used;
        const e=effDur(sl);
        if(e<=remain+eps){
          curM.push(sl);used+=e;sl=null;
          if(used>=cap-eps){result.push(curM);curM=[];used=0;mi++}
        } else {
          const[head,tail]=splitSlot(sl,remain);
          curM.push(head);used+=effDur(head);
          if(used>=cap-eps){result.push(curM);curM=[];used=0;mi++}
          sl=tail;
        }
      }
    }
    while(mi<caps.length){
      const cap=caps[mi];
      const remain=cap-used;
      if(remain>eps){
        const beat=4/parseMeter(meterAt(mi)).den;
        const pieces=splitDurationByBeat(used,remain,beat);
        pieces.forEach(p=>curM.push({type:'rest',dur:p.dur,dot:p.dot}));
      }
      result.push(curM);curM=[];used=0;mi++;
    }
    return result;
  }
  // Re-barre une plage de mesures avec une nouvelle capacite, en preservant toutes les notes.
  // Genere autant de mesures que necessaire (debordement) ou aspire les notes suivantes (remplissage).
  function rebuildRangeWithCap(slots,newCap){
    const result=[];
    let used=0,curM=[];
    const eps=1e-6;
    function splitSlot(sl,want){
      const e=effDur(sl);
      if(want>=e-eps)return[sl,null];
      if(!sl.tuplet){
        const head={...sl,dur:want,dot:false};
        const tail={...sl,dur:e-want,dot:false};
        if(sl.type==='note'){head.tieToNext=true;if(!sl.tieToNext)delete tail.tieToNext}
        return[head,tail];
      }
      return[sl,null]; // ne coupe pas un tuplet
    }
    for(const sl0 of slots){
      let sl=sl0;
      while(sl){
        const remain=newCap-used;
        const e=effDur(sl);
        if(e<=remain+eps){
          curM.push(sl);used+=e;sl=null;
          if(used>=newCap-eps){result.push(curM);curM=[];used=0}
        } else {
          const[head,tail]=splitSlot(sl,remain);
          curM.push(head);used+=effDur(head);
          if(used>=newCap-eps){result.push(curM);curM=[];used=0}
          sl=tail;
        }
      }
    }
    // Derniere mesure incomplete : completer avec des silences
    if(curM.length>0||used>eps){
      const remain=newCap-used;
      if(remain>eps){
        const{den}=parseMeter(newMeterGlobalTmp);
        const beat=4/den;
        const pieces=splitDurationByBeat(used,remain,beat);
        pieces.forEach(p=>curM.push({type:'rest',dur:p.dur,dot:p.dot}));
      }
      result.push(curM);
    }
    if(result.length===0)result.push([]);
    return result;
  }
  let newMeterGlobalTmp='4/4'; // utilise par rebuildRangeWithCap pour le beat des silences
  function applyMeterChangeFromSel(newMeter,newUnit){
    const startM=state.sel.m;
    // Determiner la fin de la plage : prochaine frontiere (changement signature/armure/cle/reprise) apres startM
    let endM=state.measures.length-1;
    for(let i=startM+1;i<state.measures.length;i++){
      const hasBoundary=(state.timeChanges[i]!==undefined)||(state.keyChanges[i]!==undefined)||(state.clefChanges[i]!==undefined)||(state.repeats[i]&&(state.repeats[i].start||state.repeats[i].end||state.repeats[i].volta!==undefined));
      if(hasBoundary){endM=i-1;break}
    }
    // Aplatir les slots de la plage [startM..endM]
    const flat=[];
    for(let i=startM;i<=endM;i++){for(const s of state.measures[i])flat.push(s)}
    // Nouvelle capacite
    newMeterGlobalTmp=newMeter;
    const newCap=measureCapacity(newMeter);
    const rebuilt=rebuildRangeWithCap(flat,newCap);
    // Remplacer la plage par les nouvelles mesures
    const before=state.measures.slice(0,startM);
    const after=state.measures.slice(endM+1);
    const oldCount=endM-startM+1;
    const newCount=rebuilt.length;
    const delta=newCount-oldCount;
    state.measures=[...before,...rebuilt,...after];
    // Decaler les changements (timeChanges/keyChanges/clefChanges/repeats) situes APRES la plage
    if(delta!==0){
      const shiftMap=(obj)=>{
        const out={};
        Object.keys(obj).forEach(k=>{
          const idx=parseInt(k,10);
          if(idx>endM)out[idx+delta]=obj[k];
          else out[idx]=obj[k];
        });
        return out;
      };
      state.timeChanges=shiftMap(state.timeChanges);
      state.keyChanges=shiftMap(state.keyChanges);
      state.clefChanges=shiftMap(state.clefChanges);
      state.repeats=shiftMap(state.repeats);
    }
    // Appliquer le changement de signature inline a startM (sauf si startM==0 -> signature globale)
    if(startM===0){
      state.pieceMeter=newMeter;
      delete state.timeChanges[0];
    } else {
      state.timeChanges[startM]=newMeter;
    }
    state.pieceUnit=newUnit;
    state.sel={m:startM,s:0};
    cleanupAccidentals();
    pushHistory();render();
  }
  function shiftPiece(direction,shiftDur,shiftDot){
    const sl=selectedSlot();if(!sl)return;
    if(sl.tuplet){alert('Decalage impossible sur une note dans un n-uplet');return}
    materializeAccidentals();
    const dur=shiftDot?shiftDur*1.5:shiftDur;
    const{slots,absSel,caps}=flattenSlots();
    if(absSel<0)return;
    let newFlat;
    if(direction>0){
      const silence={type:'rest',dur:shiftDur,dot:!!shiftDot};
      newFlat=[...slots.slice(0,absSel).map(x=>x.slot),silence,...slots.slice(absSel).map(x=>x.slot)];
      let totalDur=0;for(const s of newFlat)totalDur+=effDur(s);
      let capSum=caps.reduce((a,b)=>a+b,0);
      const lastMeter=meterAt(caps.length-1);
      while(capSum<totalDur-1e-6){
        caps.push(measureCapacity(lastMeter));
        capSum+=caps[caps.length-1];
      }
    } else {
      if(absSel===0){alert('Rien a supprimer avant');return}
      const before=slots.slice(0,absSel).map(x=>x.slot);
      const after=slots.slice(absSel).map(x=>x.slot);
      let toRemove=dur;
      const newBefore=[...before];
      const eps=1e-6;
      while(toRemove>eps&&newBefore.length>0){
        const last=newBefore[newBefore.length-1];
        if(last.tuplet){alert('Decalage gauche bloque par un n-uplet');return}
        const e=effDur(last);
        if(e<=toRemove+eps){newBefore.pop();toRemove-=e}
        else {
          const remain=e-toRemove;
          newBefore[newBefore.length-1]={...last,dur:remain,dot:false};
          toRemove=0;
        }
      }
      newFlat=[...newBefore,...after];
    }
    const rebuilt=rebuildMeasuresFromSlots(newFlat.map(s=>({slot:s})),caps);
    state.measures=rebuilt;
    if(direction>0){
      state.sel.s=state.sel.s+1;
      if(state.sel.s>=state.measures[state.sel.m].length){
        if(state.sel.m<state.measures.length-1){state.sel.m++;state.sel.s=0}
        else state.sel.s=state.measures[state.sel.m].length-1;
      }
    } else {
      if(state.sel.s>0)state.sel.s--;
      else if(state.sel.m>0){state.sel.m--;state.sel.s=Math.max(0,state.measures[state.sel.m].length-1)}
    }
    cleanupAccidentals();
    pushHistory();render();
  }

  // ============ Export MusicXML compresse (.mxl) ============
  function escapeXml(s){return (s+'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]))}
  function clefXml(clefName){
    if(clefName==='bass')return '<clef><sign>F</sign><line>4</line></clef>';
    if(clefName==='treble8')return '<clef><sign>G</sign><line>2</line><clef-octave-change>-1</clef-octave-change></clef>';
    return '<clef><sign>G</sign><line>2</line></clef>';
  }
  function keyXml(sig){return '<key><fifths>'+sig+'</fifths><mode>major</mode></key>'}
  function timeXml(meter){const{num,den}=parseMeter(meter);return '<time><beats>'+num+'</beats><beat-type>'+den+'</beat-type></time>'}
  function pitchXml(slot,effAcc){
    const step=slot.note;
    const oct=4+slot.octave;
    // effAcc: altération effective (en tenant compte armure + heritage de mesure)
    let alter=0;
    if(effAcc==='^')alter=1;
    else if(effAcc==='_')alter=-1;
    else if(effAcc==='=')alter=0;
    let s='<pitch><step>'+step+'</step>';
    if(alter!==0)s+='<alter>'+alter+'</alter>';
    s+='<octave>'+oct+'</octave></pitch>';
    return s;
  }
  function noteTypeXml(slot){
    // duree visuelle (sans n-uplet)
    const d=nominalDur(slot);
    if(d>=4)return 'whole';
    if(d>=2)return 'half';
    if(d>=1)return 'quarter';
    if(d>=0.5)return 'eighth';
    if(d>=0.25)return '16th';
    return '32nd';
  }
  function buildMusicXml(){
    const DIV=480; // divisions par noire (multiple riche pour gerer les n-uplets)
    let xml='<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n';
    xml+='<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN" "http://www.musicxml.org/dtds/partwise.dtd">\n';
    xml+='<score-partwise version="3.1">\n';
    // Work / identification
    const title=(state.headers.T||'').split('\n')[0]||'Sans titre';
    const composer=(state.headers.C||'').split('\n')[0]||'';
    xml+='<work><work-title>'+escapeXml(title)+'</work-title></work>\n';
    if(composer){
      xml+='<identification><creator type="composer">'+escapeXml(composer)+'</creator></identification>\n';
    }
    xml+='<part-list><score-part id="P1"><part-name>Voix</part-name></score-part></part-list>\n';
    xml+='<part id="P1">\n';
    let prevClef=null,prevKey=null,prevMeter=null;
    state.measures.forEach((meas,mi)=>{
      xml+='<measure number="'+(mi+1)+'">\n';
      const lC=clefAt(mi),lK=keyAt(mi),lM=meterAt(mi);
      // Attributs : divisions au debut, puis clef/key/time si changement ou si mesure 0
      const isFirst=(mi===0);
      const hasClefChange=isFirst||lC!==prevClef;
      const hasKeyChange=isFirst||lK!==prevKey;
      const hasMeterChange=isFirst||lM!==prevMeter;
      if(isFirst||hasClefChange||hasKeyChange||hasMeterChange){
        xml+='<attributes>';
        if(isFirst)xml+='<divisions>'+DIV+'</divisions>';
        if(hasKeyChange)xml+=keyXml(lK);
        if(hasMeterChange)xml+=timeXml(lM);
        if(hasClefChange)xml+=clefXml(lC);
        xml+='</attributes>\n';
      }
      // Tempo sur la premiere mesure
      if(isFirst){
        const bpmTempo=state.tempoDotted?Math.round(state.tempo*2/3):state.tempo;
        const beatUnit=state.tempoDotted?'eighth':'quarter';
        const dot=state.tempoDotted?'<beat-unit-dot/>':'';
        xml+='<direction placement="above"><direction-type><metronome><beat-unit>'+beatUnit+'</beat-unit>'+dot+'<per-minute>'+bpmTempo+'</per-minute></metronome></direction-type><sound tempo="'+state.tempo+'"/></direction>\n';
      }
      // Reprises
      const r=state.repeats[mi];
      if(r){
        if(r.start)xml+='<barline location="left"><bar-style>heavy-light</bar-style><repeat direction="forward"/></barline>\n';
        if(r.volta)xml+='<barline location="left"><ending number="'+r.volta+'" type="start"/></barline>\n';
      }
      // Notes
      meas.forEach((slot,si)=>{
        // Duree MusicXML = effDur (avec tuplet) * DIV
        const dur=Math.max(1,Math.round(effDur(slot)*DIV));
        xml+='<note>';
        if(slot.type==='rest'){
          xml+='<rest/>';
        } else {
          // Alteration effective (heritage + armure)
          const effAcc=effectiveAcc(meas,si,lK);
          xml+=pitchXml(slot,effAcc);
        }
        xml+='<duration>'+dur+'</duration>';
        xml+='<type>'+noteTypeXml(slot)+'</type>';
        if(slot.dot)xml+='<dot/>';
        // <accidental> : a afficher selon les regles de notation (cf accToDrawFor)
        if(slot.type==='note'){
          const accDraw=accToDrawFor(meas,si,lK);
          if(accDraw==='^')xml+='<accidental>sharp</accidental>';
          else if(accDraw==='_')xml+='<accidental>flat</accidental>';
          else if(accDraw==='=')xml+='<accidental>natural</accidental>';
        }
        // n-uplet
        if(slot.tuplet){
          xml+='<time-modification><actual-notes>'+slot.tuplet+'</actual-notes><normal-notes>2</normal-notes></time-modification>';
        }
        // liaison (tie)
        if(slot.tieToNext){
          xml+='<tie type="start"/>';
        }
        // notations (tie + tuplet + ornaments)
        let nota='';
        if(slot.tieToNext)nota+='<tied type="start"/>';
        if(slot.tuplet){
          // start sur premier slot du groupe, stop sur dernier
          const isFirst=(si===0||!meas[si-1]||meas[si-1].tupletId!==slot.tupletId);
          const isLast=(si===meas.length-1||!meas[si+1]||meas[si+1].tupletId!==slot.tupletId);
          if(isFirst)nota+='<tuplet type="start" bracket="yes"/>';
          if(isLast)nota+='<tuplet type="stop"/>';
        }
        if(slot.orn&&slot.orn.length){
          let orns='';
          slot.orn.forEach(o=>{
            if(o==='T')orns+='<trill-mark/>';
            else if(o==='M')orns+='<turn/>';
            else if(o==='H')nota+='<fermata/>';
            else if(o==='.')nota+='<articulations><staccato/></articulations>';
            else if(o==='L')nota+='<articulations><accent/></articulations>';
          });
          if(orns)nota+='<ornaments>'+orns+'</ornaments>';
        }
        if(slot.chord){
          nota+='<harmony>'+escapeXml(slot.chord)+'</harmony>'; // pas un vrai harmony, juste un texte simple
        }
        if(nota)xml+='<notations>'+nota+'</notations>';
        xml+='</note>\n';
      });
      // Fin de mesure : volta stop / reprise fin
      if(r){
        if(r.volta)xml+='<barline location="right"><ending number="'+r.volta+'" type="stop"/></barline>\n';
        if(r.end)xml+='<barline location="right"><bar-style>light-heavy</bar-style><repeat direction="backward"/></barline>\n';
      }
      xml+='</measure>\n';
      prevClef=lC;prevKey=lK;prevMeter=lM;
    });
    xml+='</part>\n</score-partwise>\n';
    return xml;
  }
  // ============ Encodeur ZIP minimal (stored, sans compression) ============
  // Format ZIP : pour chaque fichier => Local File Header + data + ... + Central Directory + End Of CD
  function crc32(bytes){
    // Table CRC32 calculee a la volee
    let c;
    const table=crc32._t;
    if(!table){
      const t=new Uint32Array(256);
      for(let n=0;n<256;n++){
        c=n;
        for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
        t[n]=c>>>0;
      }
      crc32._t=t;
    }
    let crc=0xFFFFFFFF;
    for(let i=0;i<bytes.length;i++)crc=(crc>>>8)^crc32._t[(crc^bytes[i])&0xFF];
    return (crc^0xFFFFFFFF)>>>0;
  }
  function strToUint8(s){
    // UTF-8 encoding
    return new TextEncoder().encode(s);
  }
  function makeZip(files){
    // files: [{name, data: Uint8Array}]
    const parts=[];
    const central=[];
    let offset=0;
    const dosTime=0,dosDate=0; // ignore date
    files.forEach(f=>{
      const nameBytes=strToUint8(f.name);
      const crc=crc32(f.data);
      const size=f.data.length;
      // Local File Header
      const lfh=new Uint8Array(30+nameBytes.length);
      const dv=new DataView(lfh.buffer);
      dv.setUint32(0,0x04034b50,true);  // signature
      dv.setUint16(4,20,true);          // version needed
      dv.setUint16(6,0,true);           // flags
      dv.setUint16(8,0,true);           // method 0 = stored
      dv.setUint16(10,dosTime,true);
      dv.setUint16(12,dosDate,true);
      dv.setUint32(14,crc,true);
      dv.setUint32(18,size,true);       // compressed size
      dv.setUint32(22,size,true);       // uncompressed size
      dv.setUint16(26,nameBytes.length,true);
      dv.setUint16(28,0,true);          // extra
      lfh.set(nameBytes,30);
      parts.push(lfh);
      parts.push(f.data);
      // Central Directory record
      const cdr=new Uint8Array(46+nameBytes.length);
      const dv2=new DataView(cdr.buffer);
      dv2.setUint32(0,0x02014b50,true);
      dv2.setUint16(4,20,true);          // version made
      dv2.setUint16(6,20,true);          // version needed
      dv2.setUint16(8,0,true);
      dv2.setUint16(10,0,true);          // method
      dv2.setUint16(12,dosTime,true);
      dv2.setUint16(14,dosDate,true);
      dv2.setUint32(16,crc,true);
      dv2.setUint32(20,size,true);
      dv2.setUint32(24,size,true);
      dv2.setUint16(28,nameBytes.length,true);
      dv2.setUint16(30,0,true);          // extra
      dv2.setUint16(32,0,true);          // comment
      dv2.setUint16(34,0,true);          // disk
      dv2.setUint16(36,0,true);          // internal attrs
      dv2.setUint32(38,0,true);          // external attrs
      dv2.setUint32(42,offset,true);
      cdr.set(nameBytes,46);
      central.push(cdr);
      offset+=lfh.length+size;
    });
    const cdStart=offset;
    let cdSize=0;
    central.forEach(c=>{parts.push(c);cdSize+=c.length;offset+=c.length});
    // End Of Central Directory
    const eocd=new Uint8Array(22);
    const dv3=new DataView(eocd.buffer);
    dv3.setUint32(0,0x06054b50,true);
    dv3.setUint16(4,0,true);
    dv3.setUint16(6,0,true);
    dv3.setUint16(8,files.length,true);
    dv3.setUint16(10,files.length,true);
    dv3.setUint32(12,cdSize,true);
    dv3.setUint32(16,cdStart,true);
    dv3.setUint16(20,0,true);
    parts.push(eocd);
    // Concatener
    let total=0;parts.forEach(p=>total+=p.length);
    const out=new Uint8Array(total);
    let pos=0;parts.forEach(p=>{out.set(p,pos);pos+=p.length});
    return out;
  }
