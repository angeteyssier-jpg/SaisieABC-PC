<style>
  .abc-app, .abc-app * { box-sizing: border-box; min-width: 0; }

  .abc-app { width: 100%; max-width: 100%; padding: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: #1a1a1a; background: #f5f4ef; border-radius: 8px;
    position: relative; overflow-x: hidden; }
  .abc-app.fullscreen { position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; border-radius: 0; z-index: 9999; overflow-y: auto; }

  /* === LAYOUT PC : 2 colonnes === */
  .pc-layout { display: grid; grid-template-columns: 260px 1fr; gap: 8px; align-items: stretch; }
  .pc-left { display: flex; flex-direction: column; gap: 6px; }
  .pc-right { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

  .ver-badge { display: flex; justify-content: space-between; align-items: center;

  .dim-info { background: #ebe9e0; border: 1px solid #d8d6ce; border-radius: 6px;

  .abc-card { background: #ffffff; border: 1px solid #d8d6ce; border-radius: 6px; padding: 6px; height: 100%; }
  /* Partition : utilise toute la hauteur de la fenetre (moins le badge version et les marges) */
  .score-wrap { width: 100%; height: calc(100vh - 85px); min-height: 360px; overflow-y: auto; }
  .score-wrap svg { width: 100%; height: 100%; display: block; }

  .ctx-card { background: #ebe9e0; border: 1px solid #d8d6ce; border-radius: 8px;

    transition: background 0.1s; }
  .abc-app button.k:hover { background: #f0eee5; }
  .abc-app button.k:active { background: #e8e6df; }

  .abc-app button.k.active { background: #cfe5fa; border-color: #185fa5; color: #0c447c; }
  .abc-app button.k.percu-pad.on { background:#185fa5; border-color:#0c447c; color:#fff; }
  .abc-app button.k.symbol { font-size: 19px; font-family: "Times New Roman", serif; }
  .abc-app button.k.primary { background: #185fa5; border-color: #185fa5; color: #ffffff; }
  .abc-app button.k.primary:hover { background: #1a6cbb; }
  .abc-app button.k.clef-small { font-size: 20px; }

  /* Notes : un peu plus hautes avec sub-label */
  .note-btn { flex-direction: column !important; gap: 0px !important; height: 38px !important; }
  .note-btn .lbl { font-size: 17px; font-weight: 700; line-height: 1; }
  .note-btn .sub { font-size: 12px; font-weight: 400; color: #5f5e5a; line-height: 1; }

  .row-grid { display: grid; gap: 3px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }
  .row-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .row-5 { grid-template-columns: repeat(5, 1fr); }
  .row-6 { grid-template-columns: repeat(6, 1fr); }
  .row-7 { grid-template-columns: repeat(7, 1fr); }

  /* Navigation : 6 boutons (à droite, au-dessus partition) */
  .nav-bar { display: grid; grid-template-columns: repeat(8, 1fr);
    gap: 5px;
    background: #fdf1d8; border: 2px solid #e2b840; padding: 5px;
    border-radius: 10px; }
  .nav-bar .k { background: #fffaee; border-color: #e2b840;
    font-size: 17px; height: 36px; padding: 0; }
  .nav-bar .k.dbtxt { font-size: 11px; font-weight: 700; }
  .nav-bar .k:hover { background: #faecc4; }
  .nav-bar .k:active { background: #f5e2a8; }

  /* Onglets : disposés en grille 2 colonnes dans la colonne de gauche */
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr) 0.6fr;
    gap: 3px;
    border-bottom: 2px solid #b4b2a9; }
  .tab { height: 38px;
    background: #ebe9e0; border: 2px solid #b4b2a9; border-bottom: none;
    border-radius: 8px 8px 0 0;
    font-family: inherit; font-size: 11px; font-weight: 700; color: #5f5e5a;
    cursor: pointer; padding: 0 2px;
    -webkit-tap-highlight-color: transparent;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; transition: background 0.1s; }
  .tab:hover { background: #ddd9c9; }
  .tab.active { background: #ffffff; color: #0c447c; border-color: #185fa5;
    margin-bottom: -2px; padding-bottom: 2px; }
  .tab:active { background: #d6d4cb; }
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; flex-direction: column; gap: 3px; }

  /* Octave / contrôles : compactes */
  .oct-row, .control-row { display: grid; grid-template-columns: 1fr 1.4fr 1fr;
    gap: 5px;
    background: #ebe9e0; padding: 5px; border-radius: 10px;
    align-items: center; }
  .oct-row .label, .control-row .label { font-size: 15px; color: #1a1a1a; text-align: center; font-weight: 700; }
  .oct-row .label b, .control-row .label b { color: #185fa5; font-size: 17px; margin-left: 4px; }

  /* Ligne transposer */
  .transpose-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px;
    background: #ebe9e0; padding: 5px; border-radius: 10px; align-items: center; }
  .transpose-row .label { font-size: 13px; color: #1a1a1a; text-align: center; font-weight: 700; }

  /* Panel d'édition : overlay centré (positionné en absolute par-dessus le layout) */
  .panel { background: #e6f1fb; border: 2px solid #378add; border-radius: 12px;
    padding: 0 10px 10px 10px; display: none;
    position: fixed; top: 160px; left: 8px;
    width: 260px; max-width: calc(100vw - 16px);
    max-height: calc(100vh - 210px); overflow-y: auto;
    z-index: 10000; box-shadow: 0 6px 24px rgba(0,0,0,0.2); }
  .panel.open { display: block; }
  /* Backdrop discret : juste pour intercepter les clics hors panel sans masquer la partition */
  .panel-backdrop { display: none; position: fixed; inset: 0;
    background: transparent; z-index: 9999; pointer-events: none; }
  .abc-app:has(.panel.open) .panel-backdrop { display: block; }
  .panel .title-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
    position: sticky; top: 0; z-index: 7; background: #e6f1fb; padding-top: 10px; }
  .panel .title { font-size: 16px; color: #0c447c; font-weight: 700; }
  .panel .title-mes { font-size: 14px; color: #185fa5; font-weight: 700; }
  .panel-nav { display: flex; align-items: center; gap: 8px; }
  .panel-nav .k { min-width: 36px; }
  .panel .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .panel input, .panel textarea { flex: 1; min-height: 34px; font-family: inherit;
    font-size: 13px; padding: 5px 7px; border: 2px solid #b4b2a9;
    border-radius: 8px; background: #ffffff; color: #1a1a1a; font-weight: 700; }
  .panel textarea { width: 100%; min-height: 120px; line-height: 1.3; }
  .panel .field-label { font-family: inherit; font-size: 12px;
    color: #0c447c; font-weight: 700; min-width: 48px; }
  .panel .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .panel .actions.three { grid-template-columns: 1fr 1fr 1fr; }
  .panel .actions.four { grid-template-columns: 1fr 1fr 1fr 1fr; }
  .panel .actions .k { width: 100% !important; padding: 0 6px !important;
    height: 36px !important; font-size: 13px !important; }
  .panel .stepper { display: grid; grid-template-columns: 40px 1fr 40px;
    gap: 5px; align-items: center; margin-bottom: 0; }
  .panel .stepper .k { height: 26px !important; font-size: 15px !important; padding: 0 !important; }
  .panel .stepper .val { text-align: center; font-family: inherit;
    font-size: 17px; color: #0c447c; font-weight: 700; }
  .panel .stepper-label { font-size: 10px; color: #1a1a1a; font-weight: 700; margin-bottom: 0; margin-top: 1px; text-align: center; }
  /* Fenêtre Rythme compacte : libellé + (− valeur +) sur une seule ligne, hauteur réduite */
  .panel .rythme-compact .stepper-inline { display: grid; grid-template-columns: 1fr 34px 46px 34px; gap: 5px; align-items: center; margin-top: 4px; }
  .panel .rythme-compact .si-label { font-size: 11px; font-weight: 700; color: #1a1a1a; white-space: nowrap; }
  .panel .rythme-compact .stepper-inline .k { height: 24px !important; font-size: 15px !important; padding: 0 !important; }
  .panel .rythme-compact .stepper-inline .val { text-align: center; font-weight: 700; }
  .panel small { display: block; color: #5f5e5a; font-size: 12px;
    margin-bottom: 8px; font-style: italic; font-weight: 600; }
  .panel .save-list { max-height: calc(100vh - 360px); min-height: 120px; overflow-y: auto;

  .panel .save-list .item { padding: 8px 10px; border-bottom: 1px solid #ebe9e0;

  .panel .save-list .item:hover { background: #f0eee5; }

    text-align: center; margin-bottom: 4px; }
  .panel .row-grid .k { height: 36px; font-size: 13px; }
  .panel .row-grid .k.symbol { font-size: 17px; }

  /* Accord */
  .chord-input { width: 100%; min-height: 44px; font-family: inherit;
    font-size: 22px; padding: 8px 12px; border: 2px solid #b4b2a9;
    border-radius: 8px; background: #ffffff; color: #1a1a1a; font-weight: 700;

  .chord-pad { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 10px; }

  /* Fenetres etroites : compacter encore le menu pour laisser le maximum a la partition */

    .abc-app button.k { height: 30px; font-size: 14px; }
    .note-btn { height: 38px !important; }
    .tab { height: 34px; font-size: 12px; }
    .nav-bar .k { height: 32px; font-size: 15px; }
    .oct-row .label, .control-row .label { font-size: 13px; }

  }
  /* Sélecteur de voix pour panneau paroles */
  .lyr-voice-tabs { display: flex; gap: 3px; flex-wrap: wrap; margin-bottom: 6px; }

  .lyr-textarea { width: 100%; min-height: 240px; font-family: inherit; font-size: 13px;

    background: #ffffff; color: #1a1a1a; font-weight: 600; line-height: 1.4;
    resize: vertical; }
  .lyr-textarea:focus { border-color: #378add; outline: none; }
  .lyr-hint { font-size: 11px; color: #5f5e5a; font-style: italic; margin: 4px 0 6px; line-height: 1.4; }

<script>
(function(){
  const NOTES=[{label:'Do',sub:'C',n:'C'},{label:'Ré',sub:'D',n:'D'},{label:'Mi',sub:'E',n:'E'},{label:'Fa',sub:'F',n:'F'},{label:'Sol',sub:'G',n:'G'},{label:'La',sub:'A',n:'A'},{label:'Si',sub:'B',n:'B'}];
  const DURATIONS=[{label:'𝅝',d:4},{label:'𝅗𝅥',d:2},{label:'♩',d:1},{label:'♪',d:0.5},{label:'♬',d:0.25},{label:'𝅘𝅥𝅰',d:0.125},{label:'𝅘𝅥𝅱',d:0.0625}];
  const SHARP_NOTES=['F','C','G','D','A','E','B'];
  const FLAT_NOTES=['B','E','A','D','G','C','F'];
  const ORNAMENTS=[{code:'T',label:'tr'},{code:'M',label:'∼ (gruppetto)'},{code:'P',label:'∿ pincé'},{code:'H',label:'𝄐 point d\'orgue'},{code:'L',label:'> accent'},{code:'.',label:'• staccato'},{code:'u',label:'⋁ levé'},{code:'v',label:'⊓ tiré'},{code:'O',label:'⊕ coda'}];
  // Boutons accord : ajoutent leur texte au champ
  const CHORD_BTNS=['#','b','m','Maj','2','4','5','6','7','9','11','13','sus','dim','aug','add','/'];
  const KEY_NAMES_MAJOR=['C','G','D','A','E','B','F♯','C♯'];
  const KEY_NAMES_MAJOR_FLAT=['C','F','B♭','E♭','A♭','D♭','G♭','C♭'];
  // Mineurs relatifs (même armure que le majeur correspondant)
  const KEY_NAMES_MINOR=['A','E','B','F♯','C♯','G♯','D♯','A♯'];          // dièses
  const KEY_NAMES_MINOR_FLAT=['A','D','G','C','F','B♭','E♭','A♭'];        // bémols

  // ===== Multi-pistes (étape 1) =====
  // Champs propres à une piste (chacun aliasé sur la piste active via defineProperty)
  const TRACK_FIELDS=['measures','pieceMeter','pieceUnit','pieceKeySig','pieceClef','timeChanges','keyChanges','clefChanges','repeats','parts'];
  const MAX_TRACKS=24;   // limite de pistes (relevee pour les imports MusicXML/GP) — modifiable librement
  // Crée une piste vierge avec valeurs par défaut
  // Clone profond des mesures (chaque slot devient un objet indépendant) : empêche absolument
  // que deux pistes partagent les mêmes objets de notes (cause de paroles qui « bavent » d'une voix
  // à l'autre). On clone aussi les maps par-mesure pour la même raison.
  function cloneMeasures(meas){
    if(!Array.isArray(meas))return [];
    return meas.map(m=>Array.isArray(m)?m.map(s=>{
      const c=Object.assign({},s);
      if(Array.isArray(s.stack))c.stack=s.stack.map(x=>Object.assign({},x));
      if(Array.isArray(s.verses))c.verses=s.verses.slice();
      if(Array.isArray(s.orn))c.orn=s.orn.slice();
      return c;
    }):[]);
  }
  function cloneMap(o){return o?JSON.parse(JSON.stringify(o)):{};}
  function makeTrack(opts){opts=opts||{};return {
    name:opts.name||'',
    sname:opts.sname||'',
    measures:cloneMeasures(opts.measures||[]),
    pieceMeter:opts.pieceMeter||'4/4',
    pieceUnit:opts.pieceUnit||'1/4',
    pieceKeySig:(opts.pieceKeySig!==undefined)?opts.pieceKeySig:0,
    pieceClef:opts.pieceClef||'treble',
    timeChanges:cloneMap(opts.timeChanges),
    keyChanges:cloneMap(opts.keyChanges),
    clefChanges:cloneMap(opts.clefChanges),
    repeats:cloneMap(opts.repeats),
    parts:cloneMap(opts.parts),
    vol:(opts.vol!==undefined)?opts.vol:100,
    mute:!!opts.mute,
    visible:(opts.visible!==undefined)?opts.visible:true,
    instrument:(opts.instrument!==undefined)?opts.instrument:0,
    percMap:opts.percMap?JSON.parse(JSON.stringify(opts.percMap)):null,
    tabShow:(opts.tabShow!==undefined)?opts.tabShow:true,
    tabOctave:opts.tabOctave||0
  }}
  const state={headers:{X:'1',T:'',C:'',N:'',H:'',F:'',Z:'',P:'',W:'',scoreVersion:''},tracks:[makeTrack()],activeTrack:0,sel:{m:0,s:0},octave:0,chordActive:0,tempo:80,tempoDotted:false,tempoBeatUnit:1,tempoBeatDotted:false,tempoChanges:{},breaks:{},volume:60,fullscreen:false,viewmode:true,activeTab:'notes',loop:false,scoreScale:130,lyricOffset:0,zoom:100,openedFileName:null,openedFileExt:null,viewFlags:{chords:true,text:true,lyrics:true,parts:true,measureNums:true},transposeScope:'all',scoreLayout:'line',tabMode:null,graceMode:false,diatoOn:false,diatoSystem:'corgeron',diatoOuter:55,diatoRows:2,diatoStrategy:'tirepousse',diatoOv:{}};
  // Aliasing : state.<champ> lit/écrit la piste active
  TRACK_FIELDS.forEach(f=>{Object.defineProperty(state,f,{
    get(){const tr=state.tracks[state.activeTrack]||state.tracks[0];return tr?tr[f]:undefined},
    set(v){const tr=state.tracks[state.activeTrack]||state.tracks[0];if(tr)tr[f]=v},
    enumerable:true,configurable:true
  })});
  function activeTrackObj(){return state.tracks[state.activeTrack]||state.tracks[0]}
  // Lot 2 : exécute une mutation sur CHAQUE piste (state.* est aliasé sur la piste active,
  // donc on bascule activeTrack temporairement). La mutation ne doit PAS appeler
  // pushHistory()/render() : l'appelant le fait une seule fois après la boucle.
  function applyToAllTracks(mutator){
    const saved=state.activeTrack;
    for(let i=0;i<state.tracks.length;i++){state.activeTrack=i;mutator(i);}
    state.activeTrack=saved;
  }
  // Nettoie un nom pour usage de nom de fichier : retire UNIQUEMENT les caractères vraiment
  // interdits par les systèmes de fichiers ; conserve accents, espaces, tirets, parenthèses.
  // Espaces remplacés par "_" pour des URL/téléchargements plus propres.
  function sanitizeFilename(name){
    let s=String(name||'').trim();
    // caractères interdits sur Windows (et sécurité générale) + caractères de contrôle
    s=s.replace(/[<>:"/\\|?*\x00-\x1f]/g,'');
    s=s.replace(/\s+/g,'_');
    s=s.replace(/_+/g,'_');
    s=s.replace(/^[_.]+|[_.]+$/g,'');   // pas de . ou _ en début/fin
    if(!s)s='morceau';
    return s.substring(0,120);
  }
  // Variante qui CONSERVE les espaces (retire seulement les caractères interdits).
  function sanitizeFilenameKeepSpaces(name){
    let s=String(name||'').trim();
    s=s.replace(/[<>:"/\\|?*\x00-\x1f]/g,'');
    s=s.replace(/\s+/g,' ').trim();
    s=s.replace(/^[. ]+|[. ]+$/g,'');
    if(!s)s='morceau';
    return s.substring(0,120);
  }
  // Nom de fichier proposé : le nom du fichier ouvert s'il existe, sinon le titre (espaces conservés).
  function proposedBaseName(){
    const title=(state.headers.T&&state.headers.T.trim().split('\n')[0])||'';
    if(state.openedFileName&&!state.nameFromTitle)return sanitizeFilenameKeepSpaces(state.openedFileName);
    if(title)return sanitizeFilenameKeepSpaces(title);
    if(state.openedFileName)return sanitizeFilenameKeepSpaces(state.openedFileName);
    return 'morceau';
  }

  // ===== Enregistrement fichier : présaisie (nom + extension) + Enregistrer / Enregistrer sous =====
  let savedFileHandle=null, savedFileHandleExt=null;   // handle File System Access du dernier fichier ecrit (si dispo)
  function buildMxlBytes(){
    const xml=buildMusicXml();
    const containerXml='<?xml version="1.0" encoding="UTF-8"?>\n<container><rootfiles><rootfile full-path="score.xml" media-type="application/vnd.recordare.musicxml"/></rootfiles></container>\n';
    const files=[
      {name:'mimetype',data:strToUint8('application/vnd.recordare.musicxml')},
      {name:'META-INF/container.xml',data:strToUint8(containerXml)},
      {name:'score.xml',data:strToUint8(xml)}
    ];
    return makeZip(files);
  }
  async function doSave(base,ext,mode){
    // ext : '.abc' ou '.mxl' ; mode : 'save' (reutilise le fichier precedent si possible) ou 'saveas'
    let data, ctype, accept;
    if(ext==='.mxl'){ data=buildMxlBytes(); ctype='application/vnd.recordare.musicxml'; accept={'application/vnd.recordare.musicxml':['.mxl']}; }
    else if(ext==='.atm'){ data=buildAtmText(_a4AtmPayload()); ctype='text/plain'; accept={'application/octet-stream':['.atm']}; }
    else { data=buildAbcText(); ctype='text/plain'; accept={'text/plain':['.abc']}; }
    const blob=new Blob([data],{type:ctype});
    if(window.showSaveFilePicker){
      try{
        let handle=null;
        if(mode==='save' && savedFileHandle && savedFileHandleExt===ext){
          handle=savedFileHandle;            // Enregistrer : reecriture directe du meme fichier, sans boite de dialogue
        } else {
          handle=await window.showSaveFilePicker({suggestedName:base+ext,startIn:(savedFileHandle||'documents'),types:[{description:ext.slice(1).toUpperCase(),accept:accept}]});
        }
        const w=await handle.createWritable(); await w.write(blob); await w.close();
        savedFileHandle=handle; savedFileHandleExt=ext;
        const nm=(handle.name||(base+ext)); state.openedFileName=nm.replace(/\.[^.]+$/,''); state.openedFileExt=ext; state.nameFromTitle=false; render();
        flash('Enregistre : '+nm); return;
      }catch(e){ if(e&&e.name==='AbortError')return; /* sinon : repli telechargement ci-dessous */ }
    }
    // Repli (Firefox/Safari ou API indisponible) : telechargement classique
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=base+ext;document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    state.openedFileName=base; state.openedFileExt=ext; state.nameFromTitle=false; render(); flash('Telecharge : '+base+ext);
  }
  function openSavePanel(kind){
    const ext=(kind==='mxl')?'.mxl':'.abc';
    const base=proposedBaseName();
    const body='<div class="row" style="display:flex;align-items:center;gap:6px;"><span class="field-label">Nom :</span>'
      +'<input id="save-name" type="text" value="'+base.replace(/"/g,'&quot;')+'" style="flex:1;"/>'
      +'<span style="color:#888;font-weight:600;">'+ext+'</span></div>'
      +'<small style="color:#888;display:block;margin-top:6px;">\u00ab Enregistrer \u00bb reecrit le fichier precedent sans redemander (Chrome/Edge). \u00ab Enregistrer sous\u2026 \u00bb ouvre toujours la boite de dialogue Windows.</small>';
    openPanel({title:'Enregistrer ('+ext.slice(1).toUpperCase()+')',body:body,hideActions:true,
      extraButtons:['Annuler','Enregistrer sous\u2026','Enregistrer'],
      onMount:()=>{const el=document.getElementById('save-name');if(el){el.focus();el.select();}},
      onExtra:(w)=>{
        if(w==='Annuler'){closePanel();return;}
        const raw=document.getElementById('save-name').value;
        const base2=sanitizeFilenameKeepSpaces(raw.replace(new RegExp('\\'+ext+'$','i'),''))||proposedBaseName();
        const mode=(w==='Enregistrer')?'save':'saveas';
        closePanel();
        doSave(base2,ext,mode);
      }
    });
  }

  const history={stack:[],pos:-1,max:100};

  // Wrapper multi-pistes : rend chaque piste visible et empile les SVG dans #score.
  // Calcule le layout horizontal partagé : largeur de chaque mesure = max sur les voix visibles
  function computeSharedLayout(visibleIdx){
    const saved=state.activeTrack;
    let N=0;
    visibleIdx.forEach(i=>{N=Math.max(N,(state.tracks[i].measures||[]).length)});
    if(N===0)N=1;
    const widthUnits=new Array(N).fill(0);
    let headerUnits=20;
    visibleIdx.forEach(i=>{
      state.activeTrack=i;
      headerUnits=Math.max(headerUnits,lineHeaderCost(0,true));
      const len=(state.measures||[]).length;
      for(let mi=0;mi<N&&mi<len;mi++){
        const c=measureCost(mi);
        if(c>widthUnits[mi])widthUnits[mi]=c;
      }
    });
    state.activeTrack=saved;
    // Étirement horizontal piloté par « Taille » (les barres restent alignées entre voix)
    const spread=(state.scoreScale||100)/100;
    for(let mi=0;mi<N;mi++)widthUnits[mi]=Math.max(24,widthUnits[mi])*spread;
    const firstX=LEFT_PAD+(headerUnits-20);
    let sum=0;for(let mi=0;mi<N;mi++)sum+=widthUnits[mi];
    const totalUnits=firstX+sum+RIGHT_PAD;
    return {single:true,N,widthUnits,firstX,totalUnits,headerUnits};
  }

  // ===== MODE PAGE : systèmes empilés (défilement vertical), barres alignées entre voix =====
  function renderScorePage(cont,tracks,visibleIdx){
    const maxVersesVisible=state.viewFlags.lyrics?Math.max(1,...visibleIdx.map(i=>countVersesTrack((tracks[i]||{}).measures))):1;
    const voiceUnitH=STAFF_TOP_Y+(STAFF_SPACING+Math.max(0,maxVersesVisible-1)*10+(state.viewFlags.lyrics?Math.max(0,state.lyricOffset||0):0))+10;
    const numV=visibleIdx.length;

    const sysUnitsW=sysPxW/pxPerUnit;

    if(cur.length)systems.push(cur);
    if(!systems.length)systems.push([]);

    let refScale=Infinity;
    for(let si=0;si<systems.length;si++){const sys=systems[si];if(!sys.length)continue;const sum=sys.reduce((a,mi)=>a+wu[mi],0)||1;const sc=usableW/sum;if(si<systems.length-1&&sc<refScale)refScale=sc;}
    if(!isFinite(refScale)||refScale<=0){const sum=(systems[0]||[]).reduce((a,mi)=>a+wu[mi],0)||1;refScale=usableW/sum;}
    // 3) rendu
    const saved=state.activeTrack;
    {const tr=state.tracks[saved];const meas=tr&&tr.measures&&tr.measures[state.sel.m];let off=0;if(meas)for(let k=0;k<state.sel.s&&k<meas.length;k++)off+=effDur(meas[k]);state._selTimeOff=off;}
    const topVisible=(visibleIdx&&visibleIdx.length)?visibleIdx[0]:saved;
    const single=(numV===1);
    let html='';
    const sysLayouts=[];
    systems.forEach((sys,si)=>{
      const isLast=(si===systems.length-1);
      const sum=sys.reduce((a,mi)=>a+wu[mi],0)||1;
      const scale=Math.min(usableW/sum,refScale);
      const bounds={}; let curX=headerStart;
      sys.forEach(mi=>{const w=wu[mi]*scale;bounds[mi]={xL:curX,xR:curX+w,measureW:w};curX+=w;});
      const sysViewW=isLast?Math.min(sysUnitsW,curX+RIGHT_PAD):sysUnitsW;
      const blockPxW=Math.round(sysViewW*pxPerUnit);
      const layout={single:false,N:N,widthUnits:wu,firstX:headerStart,totalUnits:sysViewW,headerUnits:base.headerUnits,
        _pageSystem:{mIdxs:sys,isFirst:(si===0)},_pageBounds:bounds,_pageViewW:sysViewW,_pageRefScale:refScale,
        _activeTrack:saved,_realActive:saved,_topVisible:topVisible};sysLayouts[si]=layout;
      let sysHtml='<div class="page-system" data-sys="'+si+'" style="margin-bottom:'+SYS_GAP+'px;">';
      visibleIdx.forEach(i=>{
        state.activeTrack=i; layout._renderTrack=i;
        const svg=renderScoreOnce(layout);
        const bH=Math.max(voicePxH,Math.round((layout._lastScoreH||voiceUnitH)*pxPerUnit));
        const tr=tracks[i];
        const isActive=(i===saved);
        const label=(tr.name||('V'+(i+1)))+(tr.mute?' [muet]':'');
        const border=isActive&&!single?'border:2px solid #185fa5;':'border:1px solid #d8d6ce;';
        const bg=isActive&&!single?'background:#f4f8fd;':'background:#ffffff;';
        const labelHtml=single?'':'<div style="position:absolute;top:1px;left:8px;font-size:11px;font-weight:700;color:'+(isActive?'#0c447c':'#5f5e5a')+';z-index:2;">'+escXml(label)+'</div>';
        sysHtml+='<div class="track-block" data-track="'+i+'" style="position:relative;'+border+bg+'border-radius:6px;margin-bottom:'+GAP+'px;padding-top:'+(single?2:LABEL_PX)+'px;width:'+blockPxW+'px;height:'+bH+'px;box-sizing:content-box;">'+labelHtml+'<div class="voice-svg" style="width:'+blockPxW+'px;height:'+bH+'px;">'+svg+'</div></div>';
      });
      sysHtml+='</div>';
      html+=sysHtml;
    });
    state.activeTrack=saved;
    cont.style.overflowX='hidden';
    cont.style.overflowY='auto';
    let wordsHtml='';
    if(state.viewFlags.lyrics){const w=(state.headers.W||'').trim();if(w){const lines=w.split('\n').map(l=>escXml(l)).join('<br>');wordsHtml='<div class="score-words" style="max-width:'+Math.max(sysPxW,320)+'px;margin:8px 2px 4px;padding:8px 12px;border-top:1px solid #e2e0d8;font-size:12px;line-height:1.5;color:#33312c;">'+lines+'</div>';}}
    cont.innerHTML=html+wordsHtml;
    if(numV>1){document.querySelectorAll('#score .track-block').forEach(el=>{el.addEventListener('click',(e)=>{const idx=parseInt(el.dataset.track,10);if(!isNaN(idx)&&idx!==state.activeTrack){state.activeTrack=idx;state.sel={m:0,s:0};render();}});});}

  }
  function ensureSelectionVisiblePage(cont){
    const pc=state._pageCache;if(!pc||!pc.systems)return;
    const mi=state.sel.m; let si=-1;
    for(let k=0;k<pc.systems.length;k++){if(pc.systems[k].indexOf(mi)>=0){si=k;break;}}
    if(si<0)return;
    const el=cont.querySelector('.page-system[data-sys="'+si+'"]');
    if(!el)return;
    const r=el.getBoundingClientRect(), rc=cont.getBoundingClientRect();
    const top=r.top-rc.top+cont.scrollTop, bot=top+r.height;
    const viewT=cont.scrollTop, viewB=cont.scrollTop+cont.clientHeight, margin=12;
    if(top<viewT+margin)cont.scrollTop=Math.max(0,top-margin);
    else if(bot>viewB-margin)cont.scrollTop=Math.max(0,bot-cont.clientHeight+margin);
  }
  // ===== TABLATURE (guitare 6 cordes EADGBE / banjo ténor irlandais 4 cordes GDAE) =====
  // ===== Ligne rythmique au-dessus de la tablature (hampes, ligatures, points, silences) =====
  function __rhyFc(t){const d=t.dur;if(d<=0.0625+1e-6)return 4;if(d<=0.125+1e-6)return 3;if(d<=0.25+1e-6)return 2;if(d<=0.5+1e-6)return 1;return 0;}
  function __rhyRest(t,cx,baseY,h,ink){const eD=nominalDur(t);const topY=baseY-h;const midY=baseY-h*0.5;
    if(eD>=4)return '<rect x="'+(cx-4)+'" y="'+(midY-1)+'" width="8" height="3" fill="'+ink+'"/>';
    if(eD>=2)return '<rect x="'+(cx-4)+'" y="'+(midY-2)+'" width="8" height="3" fill="'+ink+'"/>';
    if(eD>=1)return '<path d="M'+(cx-2)+' '+topY+' l3,3 l-3.5,3.5 l4,4" fill="none" stroke="'+ink+'" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
    const nF=(eD>=0.5)?1:(eD>=0.25)?2:(eD>=0.125)?3:4;let r='<line x1="'+(cx+1.6)+'" y1="'+topY+'" x2="'+(cx-1.6)+'" y2="'+baseY+'" stroke="'+ink+'" stroke-width="1.4" stroke-linecap="round"/>';for(let k=0;k<nF;k++){const fy=topY+k*4;r+='<circle cx="'+(cx-1)+'" cy="'+(fy+1)+'" r="1.4" fill="'+ink+'"/>';}return r;}
  function __rhyMeasureSvg(m,cxBySlot,bg,baseY,h){
    const ink='#1a1a1a';let s='';const topY=baseY-h;
    const inGroup={};bg.forEach((g,gi)=>g.forEach(si=>{inGroup[si]=gi;}));
    for(let si=0;si<m.length;si++){const t=m[si];const cx=cxBySlot[si];if(cx==null)continue;
      if(t.type==='rest'){s+=__rhyRest(t,cx,baseY,h,ink);if(t.dot)s+='<circle cx="'+(cx+5)+'" cy="'+(baseY-h*0.5)+'" r="1.1" fill="'+ink+'"/>';continue;}
      if(t.type!=='note')continue;
      s+='<line x1="'+cx+'" y1="'+baseY+'" x2="'+cx+'" y2="'+topY+'" stroke="'+ink+'" stroke-width="1"/>';
      const fc=__rhyFc(t);
      if(fc>0&&inGroup[si]===undefined){for(let f=0;f<fc;f++){const fy=topY+f*4;s+='<path d="M '+cx+' '+fy+' Q '+(cx+7)+' '+(fy+4)+' '+(cx+4)+' '+(fy+9)+'" stroke="'+ink+'" stroke-width="1" fill="none" stroke-linecap="round"/>';}}
      if(t.dot)s+='<circle cx="'+(cx+5)+'" cy="'+(baseY-3)+'" r="1.1" fill="'+ink+'"/>';
    }
    bg.forEach(g=>{
      if(g.length<2)return;
      const x1=cxBySlot[g[0]],x2=cxBySlot[g[g.length-1]];if(x1==null||x2==null)return;
      s+='<line x1="'+x1+'" y1="'+topY+'" x2="'+x2+'" y2="'+topY+'" stroke="'+ink+'" stroke-width="2.4"/>';
      for(let lev=2;lev<=4;lev++){const y=topY+(lev-1)*3.2;
        for(let k=0;k<g.length;k++){const si=g[k];if(__rhyFc(m[si])<lev)continue;
          const nx=(k+1<g.length)?g[k+1]:null;
          if(nx!==null&&__rhyFc(m[nx])>=lev){s+='<line x1="'+cxBySlot[si]+'" y1="'+y+'" x2="'+cxBySlot[nx]+'" y2="'+y+'" stroke="'+ink+'" stroke-width="2"/>';}
          else{const pv=(k>0)?g[k-1]:null;if(!(pv!==null&&__rhyFc(m[pv])>=lev)){const dir=(k>0)?-1:1;s+='<line x1="'+cxBySlot[si]+'" y1="'+y+'" x2="'+(cxBySlot[si]+dir*5)+'" y2="'+y+'" stroke="'+ink+'" stroke-width="2"/>';}}
        }
      }
    });
    // n-uplets : petit chiffre au-dessus du groupe
    {let ti=0;while(ti<m.length){const t=m[ti];if(t&&t.tuplet&&t.tupletId!=null){const id=t.tupletId;let xs=[];let k=ti;while(k<m.length&&m[k].tupletId===id){if(cxBySlot[k]!=null)xs.push(cxBySlot[k]);k++;}if(xs.length){const cxm=(xs[0]+xs[xs.length-1])/2;s+='<text x="'+cxm+'" y="'+(topY-1.5)+'" font-size="6.5" font-style="italic" fill="'+ink+'" text-anchor="middle">'+t.tuplet+'</text>';}ti=k;}else ti++;}}
    return s;
  }
  function __tabStripSvg(on,tabTop,bounds,marks,tun,gap,xL0,xR0){
    if(!on||!bounds||!bounds.length)return '';
    const n=tun.open.length, ink='#1a1a1a', sel='#e24b4a', bot=tabTop+(n-1)*gap;
    let s='<rect x="'+xL0+'" y="'+(tabTop-3)+'" width="'+(xR0-xL0)+'" height="'+((n-1)*gap+6)+'" fill="#fbf7ec" opacity="0.6"/>';
    for(let i=0;i<n;i++){const y=tabTop+i*gap;s+='<line x1="'+xL0+'" y1="'+y+'" x2="'+xR0+'" y2="'+y+'" stroke="'+ink+'" stroke-width="0.4" opacity="0.55"/>';}
    for(let i=0;i<n;i++){const y=bot-i*gap;s+='<text x="'+(xL0-9)+'" y="'+(y+2.4)+'" font-size="6" font-family="sans-serif" fill="'+ink+'" text-anchor="middle">'+tun.names[i]+'</text>';}
    s+='<line x1="'+xL0+'" y1="'+tabTop+'" x2="'+xL0+'" y2="'+bot+'" stroke="'+ink+'" stroke-width="0.7"/>';
    bounds.forEach(b=>{s+='<line x1="'+b.xR+'" y1="'+tabTop+'" x2="'+b.xR+'" y2="'+bot+'" stroke="'+ink+'" stroke-width="0.6" opacity="0.7"/>';});
    marks.forEach(mk=>{const y=bot-mk.str*gap;const t=''+mk.fret;const w=t.length*4.2+2;s+='<rect x="'+(mk.cx-w/2)+'" y="'+(y-4)+'" width="'+w+'" height="8" fill="#fbf7ec"/>';s+='<text x="'+mk.cx+'" y="'+(y+2.7)+'" font-size="7" font-family="sans-serif" fill="'+(mk.sel?sel:ink)+'" font-weight="'+(mk.sel?'700':'600')+'" text-anchor="middle">'+t+'</text>';});
    return s;
  }

        +'<button class="k tabv-gapu" data-i="'+i+'" style="font-size:12px;min-width:24px;" title="Eloigner la tablature de la portee">+</button>'

  // ===== Accordéon diatonique : clavier, résolution, tablature (Corgeron / CADB) =====
  // Le clavier est GÉNÉRÉ à partir des toniques des rangs (motif mélodéon : poussé = triade
  // de la tonalité du rang, tiré = les autres degrés). Rang 0 = extérieur (Sol), rang 1 =
  // intérieur (Do, une quarte au-dessus), rang 2 = 3e rang (Fa). Tout est musicalement
  // cohérent par construction ; les boutons 1/1' (parfois des altérations selon le facteur)
  // suivent simplement le motif et restent corrigeables note par note.
  const DIATO_GAP=7;
  function diatoKeyboard(){
    const outer=state.diatoOuter||55;            // Sol3 = MIDI 55 par défaut (clavier Sol/Do)
    const nRows=state.diatoRows||2;
    const counts=[11,10,10];                      // nb de boutons par rang
    const labels=['G','C','F'];
    const rows=[];
    for(let r=0;r<nRows;r++){
      const tonic=outer+5*r;                      // chaque rang est une quarte au-dessus du précédent
      const nbtn=counts[r]||10;
      const btns=[];
      for(let b=1;b<=nbtn;b++){
        const i=b-3;
        const oct=Math.floor(i/3);
        const deg3=[0,4,7][((i%3)+3)%3];
        const push=tonic+12*oct+deg3;
        const j=b-3;
        const pp=[2,5,9,11];
        const pull=tonic+12*Math.floor(j/4)+pp[((j%4)+4)%4];
        btns.push({btn:b,push:push,pull:pull});
      }
      rows.push({label:labels[r]||('R'+(r+1)),tonic:tonic,btns:btns});
    }
    return rows;
  }
  // Toutes les façons de jouer une hauteur MIDI : liste de {row,btn,pull}
  function diatoResolve(midi){
    const kb=diatoKeyboard(); const out=[];
    kb.forEach((row,ri)=>row.btns.forEach(b=>{
      if(b.push===midi)out.push({row:ri,btn:b.btn,pull:false});
      if(b.pull===midi)out.push({row:ri,btn:b.btn,pull:true});
    }));
    return out;
  }
  // Choix par défaut selon la stratégie (corrigeable ensuite à la main)
  function diatoPick(cands){
    if(!cands||!cands.length)return null;
    const arr=cands.slice();
    if((state.diatoStrategy||'tirepousse')==='croise'){
      // jeu croisé : privilégier le poussé (un seul sens), puis rang intérieur, puis bouton bas
      arr.sort((a,b)=>(a.pull-b.pull)||(b.row-a.row)||(a.btn-b.btn));
    } else {
      // tiré-poussé : privilégier le rang extérieur (Sol), puis bouton bas
      arr.sort((a,b)=>(a.row-b.row)||(a.btn-b.btn)||(a.pull-b.pull));
    }
    return arr[0];
  }
  // Position effective d'une note (override manuel sinon auto). key = "t:m:s:n"
  function diatoPosFor(midi,trackIdx,m,s,n){
    const cands=diatoResolve(midi);
    if(!cands.length)return null;
    const ov=(state.diatoOv||{})[trackIdx+':'+m+':'+s+':'+n];
    if(ov){
      const hit=cands.find(c=>c.row===ov.row&&c.btn===ov.btn&&c.pull===!!ov.pull);
      if(hit)return hit;
    }
    return diatoPick(cands);
  }
  // Hauteur en demi-tons d'un nombre de lignes pour le système choisi
  function diatoStripH(){
    const sys=state.diatoSystem||'corgeron';
    const nRows=state.diatoRows||2;
    const corg=(nRows-1)*DIATO_GAP+16;
    const cadb=DIATO_GAP+16;
    if(sys==='cadb')return cadb;
    if(sys==='both')return corg+cadb+6;
    return corg;
  }
  // Rend une bande de tablature diato sous la portée.
  // marks : [{cx,row,btn,pull,sel}]
  function __diatoStripSvg(top,bounds,marks,xL0,xR0){
    const ink='#1a1a1a', sel='#e24b4a';
    const sys=state.diatoSystem||'corgeron';
    const nRows=state.diatoRows||2;
    let s='';
    // --- bloc Corgeron : une ligne par rang, tonalité la plus haute en haut, tiré souligné ---
    function corgeron(yTop){
      const order=[]; for(let r=0;r<nRows;r++)order.push(r);
      order.sort((a,b)=>b-a);                       // rang de tonique haute (F,C) au-dessus de G
      const labels={0:'G',1:'C',2:'F'};
      const lineY={}; order.forEach((r,i)=>{lineY[r]=yTop+i*DIATO_GAP;});
      const h=(order.length-1)*DIATO_GAP;
      s+='<rect x="'+xL0+'" y="'+(yTop-3)+'" width="'+(xR0-xL0)+'" height="'+(h+6)+'" fill="#fbf7ec" opacity="0.6"/>';
      order.forEach(r=>{const y=lineY[r];
        s+='<line x1="'+xL0+'" y1="'+y+'" x2="'+xR0+'" y2="'+y+'" stroke="'+ink+'" stroke-width="0.4" opacity="0.55"/>';
        s+='<text x="'+(xL0-9)+'" y="'+(y+2.4)+'" font-size="6.5" font-family="sans-serif" fill="'+ink+'" text-anchor="middle">'+labels[r]+'</text>';});
      s+='<line x1="'+xL0+'" y1="'+yTop+'" x2="'+xL0+'" y2="'+(yTop+h)+'" stroke="'+ink+'" stroke-width="0.7"/>';
      (bounds||[]).forEach(b=>{s+='<line x1="'+b.xR+'" y1="'+yTop+'" x2="'+b.xR+'" y2="'+(yTop+h)+'" stroke="'+ink+'" stroke-width="0.6" opacity="0.7"/>';});
      marks.forEach(mk=>{const y=(lineY[mk.row]!==undefined)?lineY[mk.row]:yTop; const t=''+mk.btn; const w=t.length*4.2+2; const col=mk.sel?sel:ink;
        s+='<rect x="'+(mk.cx-w/2)+'" y="'+(y-4)+'" width="'+w+'" height="8" fill="#fbf7ec"/>';
        s+='<text x="'+mk.cx+'" y="'+(y+2.7)+'" font-size="7" font-family="sans-serif" fill="'+col+'" font-weight="'+(mk.sel?'700':'600')+'" text-anchor="middle">'+t+'</text>';
        if(mk.pull)s+='<line x1="'+(mk.cx-w/2)+'" y1="'+(y+3.6)+'" x2="'+(mk.cx+w/2)+'" y2="'+(y+3.6)+'" stroke="'+col+'" stroke-width="0.7"/>';});
      return h;
    }
    // --- bloc CADB : 2 lignes P (poussé, haut) et T (tiré, bas), rang en apostrophe ---
    function cadb(yTop){
      const yP=yTop, yT=yTop+DIATO_GAP, h=DIATO_GAP;
      s+='<rect x="'+xL0+'" y="'+(yTop-3)+'" width="'+(xR0-xL0)+'" height="'+(h+6)+'" fill="#fbf7ec" opacity="0.6"/>';
      [['P',yP],['T',yT]].forEach(L=>{const y=L[1];
        s+='<line x1="'+xL0+'" y1="'+y+'" x2="'+xR0+'" y2="'+y+'" stroke="'+ink+'" stroke-width="0.4" opacity="0.55"/>';
        s+='<text x="'+(xL0-9)+'" y="'+(y+2.4)+'" font-size="6.5" font-family="sans-serif" fill="'+ink+'" text-anchor="middle">'+L[0]+'</text>';});
      s+='<line x1="'+xL0+'" y1="'+yP+'" x2="'+xL0+'" y2="'+yT+'" stroke="'+ink+'" stroke-width="0.7"/>';
      (bounds||[]).forEach(b=>{s+='<line x1="'+b.xR+'" y1="'+yP+'" x2="'+b.xR+'" y2="'+yT+'" stroke="'+ink+'" stroke-width="0.6" opacity="0.7"/>';});
      marks.forEach(mk=>{const y=mk.pull?yT:yP; const ap=mk.row>=1?"'".repeat(mk.row):''; const t=mk.btn+ap; const w=t.length*4.2+2; const col=mk.sel?sel:ink;
        s+='<rect x="'+(mk.cx-w/2)+'" y="'+(y-4)+'" width="'+w+'" height="8" fill="#fbf7ec"/>';
        s+='<text x="'+mk.cx+'" y="'+(y+2.7)+'" font-size="7" font-family="sans-serif" fill="'+col+'" font-weight="'+(mk.sel?'700':'600')+'" text-anchor="middle">'+t+'</text>';});
      return h;
    }
    if(sys==='cadb'){cadb(top);}
    else if(sys==='both'){const h=corgeron(top);cadb(top+h+6+8);}
    else{corgeron(top);}
    return s;
  }
  function renderDiatoPanel(){
    const host=document.getElementById('diato-body'); if(!host)return;
    const btn=document.getElementById('btn-tab-diato'); if(btn)btn.classList.toggle('active',!!state.diatoOn);

    // --- nombre de notes injouables sur ce clavier (voix active) ---
    {let nMiss=0;const ms=state.measures||[];ms.forEach((mm,mi)=>{const sg=keyAt(mi);const sh=clefSoundShift(clefAt(mi));mm.forEach((tt,si)=>{if(tt&&tt.type==='note'){const md=midiOfNote(tt.note,tt.octave,effectiveAcc(mm,si,sg),sg)+sh;if(diatoResolve(md).length===0)nMiss++;}});});h+='<div style="font-size:11px;margin:8px 0 2px;'+(nMiss>0?'color:#1565c0;font-weight:600;':'color:#2a8a3e;')+'">'+(nMiss>0?(nMiss+' note'+(nMiss>1?'s':'')+' injouable'+(nMiss>1?'s':'')+' sur ce clavier (en bleu dans la portée)'):'Toutes les notes sont jouables ✓')+'</div>';}

        h+='<div style="font-size:12px;margin-bottom:4px;">'+lab+' <span style="color:#8a8880;">('+cands.length+' position'+(cands.length>1?'s':'')+')</span></div>';
        h+='<button class="k" id="diato-cycle" style="font-size:13px;width:100%;">↻ Autre position</button>';
      }
    } else {
      h+='<div style="font-size:11px;color:#8a8880;">Sélectionnez une note dans la portée pour corriger son doigté.</div>';
    }
    host.innerHTML=h;
    host.querySelectorAll('.diato-sys').forEach(b=>b.addEventListener('click',()=>{state.diatoSystem=b.dataset.v;renderDiatoPanel();render();}));

    const cyc=document.getElementById('diato-cycle');
    if(cyc)cyc.addEventListener('click',()=>{
      const sl=selectedSlot(); if(!sl||sl.type!=='note')return;
      const sig=keyAt(state.sel.m);
      const midi=midiOfNote(sl.note,sl.octave,effectiveAcc(state.measures[state.sel.m],state.sel.s,sig),sig)+clefSoundShift(clefAt(state.sel.m));
      const cands=diatoResolve(midi); if(cands.length<2)return;       // une seule position : rien à proposer
      const key=state.activeTrack+':'+state.sel.m+':'+state.sel.s+':0';
      const cur=diatoPosFor(midi,state.activeTrack,state.sel.m,state.sel.s,0);
      let idx=cands.findIndex(c=>cur&&c.row===cur.row&&c.btn===cur.btn&&c.pull===cur.pull);

  // Fait défiler #score horizontalement pour que la mesure sélectionnée soit visible (play + navigation)
  function ensureSelectionVisible(){
    const cont=document.getElementById('score');
    if(cont&&(state.scoreLayout||'line')==='page'){ensureSelectionVisiblePage(cont);return;}
    const lc=state._layoutCache;
    if(!cont||!lc||!lc.layout)return;
    const mi=state.sel.m;
    const wu=lc.layout.widthUnits;
    if(mi<0||mi>=wu.length)return;
    function leftOf(idx){let x=lc.layout.firstX;for(let k=0;k<idx&&k<wu.length;k++)x+=wu[k];return x;}
    const xL=leftOf(mi), xR=xL+wu[mi];
    const pxL=xL*lc.pxPerUnit, pxR=xR*lc.pxPerUnit;
    const viewL=cont.scrollLeft, viewR=cont.scrollLeft+cont.clientWidth;
    const margin=24;
    // Anticipation : on garde ~2 mesures visibles DEVANT la sélection, de sorte que la mesure
    // courante se cale sur l'avant-avant-dernière mesure visible (saisie + play).
    const LOOKAHEAD=2;
    const aheadIdx=Math.min(mi+LOOKAHEAD, wu.length-1);
    const pxAheadR=(leftOf(aheadIdx)+wu[aheadIdx])*lc.pxPerUnit;
    if(pxL<viewL+margin){
      // recul : amener la sélection près du bord gauche
      cont.scrollLeft=(mi===0)?0:Math.max(0,pxL-margin);
    } else if(pxAheadR>viewR-margin){
      // Si la fin du morceau est déjà visible, ne pas défiler davantage vers la droite
      // (évite de continuer à pousser alors qu'il n'y a plus rien à révéler en fin de partition).
      const totalPx=(lc.layout.totalUnits||0)*lc.pxPerUnit;
      if(totalPx<=viewR+1)return;
      // avance : amener la 2e mesure d'anticipation au bord droit, sans masquer le début de la sélection
      let target=pxAheadR-cont.clientWidth+margin;
      target=Math.min(target, pxL-margin); // ne jamais cacher le début de la mesure sélectionnée
      target=Math.max(0,Math.min(target, totalPx-cont.clientWidth)); // borne au défilement max réel
      cont.scrollLeft=target;
    }
  }

  // Liste des notes d'un slot accord, triées grave->aigu : [{note,octave,acc,_main:bool,_idx}]
  function chordList(sl){
    if(!sl||sl.type!=='note')return [];
    const arr=[{note:sl.note,octave:sl.octave,acc:sl.acc||'',_main:true}];
    if(sl.stack)sl.stack.forEach((x,i)=>arr.push({note:x.note,octave:x.octave,acc:x.acc||'',_main:false,_si:i}));
    const sig=keyAt(state.sel.m);
    arr.sort((a,b)=>midiOfNote(a.note,a.octave,a.acc,sig)-midiOfNote(b.note,b.octave,b.acc,sig));
    return arr;
  }
  // Réécrit le slot à partir d'une liste de notes (la plus grave devient la note principale)
  function chordWrite(sl,list){
    if(!list.length)return;
    const sig=keyAt(state.sel.m);
    const sorted=list.slice().sort((a,b)=>midiOfNote(a.note,a.octave,a.acc||'',sig)-midiOfNote(b.note,b.octave,b.acc||'',sig));
    const base=sorted[0];
    sl.note=base.note;sl.octave=base.octave;if(base.acc)sl.acc=base.acc;else delete sl.acc;
    const rest=sorted.slice(1);
    if(rest.length)sl.stack=rest.map(x=>({note:x.note,octave:x.octave,acc:x.acc||''}));
    else delete sl.stack;
  }
  // Supprime silencieusement les doublons exacts (note+octave+altération identiques)
  // d'un accord. Appelé à la SORTIE de la saisie (Fin, déplacement de slot), pas au clic.
  // Renvoie true si au moins un doublon a été retiré.
  function dedupeChord(sl){
    if(!sl||sl.type!=='note')return false;
    const list=chordList(sl);
    if(list.length<=1)return false;
    const seen=new Set();const kept=[];
    for(const x of list){
      const key=x.note+'|'+x.octave+'|'+(x.acc||'');
      if(seen.has(key))continue;
      seen.add(key);kept.push(x);
    }
    if(kept.length===list.length)return false; // rien à retirer
    chordWrite(sl,kept);
    // Réajuster l'index actif dans les nouvelles bornes
    state.chordActive=Math.max(0,Math.min(state.chordActive||0,kept.length-1));
    return true;
  }

  // ===== Saisie batterie directe depuis l'onglet percu =====
  // Decoupe un token de percMap (ex. '^g','E','d') en {note,octave,acc}.
  function parsePercTok(tok){const m=tok.match(/^(\^\^|__|\^|_|=)?([A-Ga-g])('+|,+)?$/);if(!m)return null;let octave=(m[2]===m[2].toLowerCase())?1:0;const adj=m[3]||'';for(const ch of adj){if(ch==="'")octave++;else if(ch===',')octave--;}return {note:m[2].toUpperCase(),octave:octave,acc:m[1]||''};}
  // Ensemble des tokens presents sur le slot courant (voix perc uniquement).
  function percTokensAtSelection(){const set={};const tr=state.tracks[state.activeTrack];if(!tr||tr.pieceClef!=='perc')return set;const sl=selectedSlot();if(!sl||sl.type!=='note')return set;set[noteToken(sl.note,sl.octave,sl.acc||'')]=true;if(sl.stack)sl.stack.forEach(sn=>{set[noteToken(sn.note,sn.octave,sn.acc||'')]=true;});return set;}
  // Pose (ou retire si deja present) un coup de percussion au curseur. Empilement auto.
  function togglePercAtSelection(tok){const tr=state.tracks[state.activeTrack];if(!tr||tr.pieceClef!=='perc')return;const p=parsePercTok(tok);if(!p)return;const sl=selectedSlot();if(!sl)return;const here=percTokensAtSelection();
    if(here[tok]){
      if(sl.type==='note'){const list=chordList(sl).filter(x=>noteToken(x.note,x.octave,x.acc||'')!==tok).map(x=>({note:x.note,octave:x.octave,acc:x.acc||''}));if(list.length)chordWrite(sl,list);else{const ns={type:'rest',dur:sl.dur,dot:sl.dot};if(sl.tuplet){ns.tuplet=sl.tuplet;ns.tupletId=sl.tupletId;if(sl.tupletNormal!==undefined)ns.tupletNormal=sl.tupletNormal}state.measures[state.sel.m][state.sel.s]=ns;}}
      pushHistory();render();return;
    }
    if(sl.type!=='note'){const ns={type:'note',note:p.note,octave:p.octave,dur:sl.dur,dot:sl.dot};if(p.acc)ns.acc=p.acc;if(sl.tuplet){ns.tuplet=sl.tuplet;ns.tupletId=sl.tupletId;if(sl.tupletNormal!==undefined)ns.tupletNormal=sl.tupletNormal}state.measures[state.sel.m][state.sel.s]=ns;}
    else{const list=chordList(sl).map(x=>({note:x.note,octave:x.octave,acc:x.acc||''}));list.push({note:p.note,octave:p.octave,acc:p.acc});chordWrite(sl,list);}
    previewNote(midiOfNote(p.note,p.octave,p.acc,0),0.5,true,percKindForSlot(tr,p.note,p.octave,p.acc));
    pushHistory();render();
  }

    // car on y règle les voix jouées et les volumes pendant la lecture.
    if(previous==='play'&&name!=='play'&&name!=='pistes'){
      if(audio.playing)stopPlayback(true);

  // ⭐ Panneau Saisie Paroles : textarea par voix, parsing tirets/espaces → slots notes
  (function(){
    const btn=document.getElementById('btn-edit-lyrics');
    if(!btn)return;
    btn.addEventListener('click',()=>{
      // Voix courante dans le panneau (indice dans state.tracks)
      let lyrTrack=state.activeTrack;

      // Construit le texte des paroles de la piste `ti` : UNE ligne par couplet.
      function lyricsToText(ti){
        const saved=state.activeTrack;
        state.activeTrack=ti;
        const tr=state.tracks[ti];
        const notes=[];
        (tr.measures||[]).forEach(m=>m.forEach(s=>{if(s.type==='note')notes.push(s)}));
        const nv=countVersesInNotes(notes);
        const lines=[];
        for(let v=1;v<=nv;v++){
          const parts=notes.map(s=>verseSyl(s,v).replace(/_/g,'').replace(/~/g,' ').replace(/-+$/,m=>'-'));
          // Retirer les notes vides en fin de ligne (sinon espaces parasites),
          // mais conserver les vides en tête / au milieu qui matérialisent les décalages.
          while(parts.length && parts[parts.length-1]==='') parts.pop();
          lines.push(parts.join(' '));
        }
        // Retirer les couplets entièrement vides en fin
        while(lines.length>1 && lines[lines.length-1].trim()==='') lines.pop();
        state.activeTrack=saved;
        return lines.join('\n');
      }

      // Parse le texte et assigne les syllabes aux notes de la piste `ti`.
      // CHAQUE LIGNE (touche Entrée) = UN COUPLET. Au sein d'une ligne :
      //   séparateur espace ou tiret ;
      //   mot-mot  → 'mot-' sur note 1, 'mot' sur note 2 (tiret de liaison ABC) ;
      //   mot      → syllabe autonome ;
      //   espace en trop / en début de ligne → note sautée (DÉCALAGE).
      function textToLyrics(ti, text){
        const saved=state.activeTrack;
        state.activeTrack=ti;
        const tr=state.tracks[ti];

        // Collecter les notes
        const notes=[];
        (tr.measures||[]).forEach(m=>m.forEach(s=>{if(s.type==='note')notes.push(s)}));
        // Effacer toutes les paroles existantes (tous couplets)
        notes.forEach(n=>{delete n.lyric;delete n.verses});

        // Normaliser : CR retirés ; tab→espace. Les sauts de ligne séparent les COUPLETS.
        const norm=text.replace(/\r/g,'').replace(/\t/g,' ');
        const lines=norm.split('\n');
        // Retirer les couplets vides en fin
        while(lines.length>1 && lines[lines.length-1].trim()==='') lines.pop();
        if(lines.length===1 && !lines[0].trim()){state.activeTrack=saved;return}

        lines.forEach((line,vi)=>{
          const verse=vi+1;
          const syls=parseLyricLineToSyls(line);
          for(let i=0;i<syls.length&&i<notes.length;i++){
            // Syllabe vide ('') → note laissée sans parole pour ce couplet : décalage assuré
            if(syls[i]!=='') setVerseSyl(notes[i],verse,syls[i]);
          }
        });
        notes.forEach(cleanupVerses);
        state.activeTrack=saved;
      }

      // Compte les notes d'une piste
      function countNotes(ti){
        const tr=state.tracks[ti];
        let n=0;
        (tr.measures||[]).forEach(m=>m.forEach(s=>{if(s.type==='note')n++}));
        return n;
      }

      function buildVoiceTabsHtml(){
        let h='<div class="lyr-voice-tabs" id="lyr-voice-tabs">';
        state.tracks.forEach((tr,i)=>{
          const name=tr.name||('V'+(i+1));
          h+='<button class="k" data-lyrtrack="'+i+'">'+escXml(name)+'</button>';
        });
        h+='</div>';
        return h;
      }

      function buildBody(){
        const ti=lyrTrack;
        const n=countNotes(ti);
        const txt=lyricsToText(ti);
        return buildVoiceTabsHtml()+
          '<div class="lyr-note-count" id="lyr-note-count">Notes sur cette piste : <b>'+n+'</b></div>'+
          '<textarea class="lyr-textarea" id="lyr-textarea" spellcheck="false">'+escXml(txt)+'</textarea>';
      }
      const LYR_HINT='<p class="lyr-hint" id="lyr-hint">Tapez les paroles : l\'application est instantanée. Espace = syllabe suivante ; un espace EN TROP (ou EN DÉBUT de ligne) saute une note et DÉCALE la suite. Tiret (bon-jour) = syllabes liées. <b>Entrée = nouveau couplet</b> (chaque ligne s\'aligne sur les mêmes notes ; affichés empilés sous la portée et exportés en w:/MusicXML). Videz le champ pour effacer.</p>';

      function refreshTabHighlight(){
        document.querySelectorAll('#lyr-voice-tabs .k').forEach(b=>{
          b.classList.toggle('active',parseInt(b.dataset.lyrtrack,10)===lyrTrack);
        });
      }

      // Application instantanée du texte aux paroles de la voix courante
      function applyNow(){
        const ta=document.getElementById('lyr-textarea');
        if(!ta)return;
        textToLyrics(lyrTrack, ta.value);
        state.viewFlags.lyrics=true;
        render();
      }
      // Suivre en affichage la MESURE correspondant à la position du curseur dans le texte.
      // On compte les syllabes de la LIGNE courante (un couplet) jusqu'au curseur → index de note,
      // puis on sélectionne cette note dans la voix des paroles et on fait défiler la partition.
      function followCaret(){
        const ta=document.getElementById('lyr-textarea');
        if(!ta)return;
        const pos=ta.selectionStart;
        const upto=ta.value.substring(0,pos);
        // Ligne courante = couplet courant ; on ne compte que sur cette ligne.
        const nl=upto.lastIndexOf('\n');
        const lineStart=nl+1;
        const lineText=upto.substring(lineStart);
        // nombre de syllabes (séparées par espaces ; chaque espace fait avancer d'une note)
        const syls=lineText.split(' ');
        let noteIdx=Math.max(0,syls.length-1);
        // Localiser la note d'index noteIdx dans la voix des paroles, repérer sa mesure/slot.
        const tr=state.tracks[lyrTrack];
        if(!tr)return;
        let count=0,found=null;
        (tr.measures||[]).forEach((meas,mi)=>{meas.forEach((s,si)=>{if(s.type==='note'){if(count===noteIdx)found={m:mi,s:si};count++;}})});
        if(found){
          state.sel={m:found.m,s:found.s};
          ensureSelectionVisible();
        }
      }

      openPanel({
        title:'Saisie Paroles',
        body:buildBody(),
        hideActions:true,
        extraButtons:['Fermer'],
        onMount:()=>{
          // Placer le texte explicatif SOUS le bouton Fermer
          const actions=document.querySelector('#panel-body .actions');
          if(actions&&!document.getElementById('lyr-hint')){actions.insertAdjacentHTML('afterend',LYR_HINT);}
          refreshTabHighlight();
          const ta=document.getElementById('lyr-textarea');
          if(ta){
            // Application instantanée à chaque frappe + suivi de la mesure courante
            ta.addEventListener('input',()=>{ applyNow(); followCaret(); });
            ta.addEventListener('keyup',()=>{ followCaret(); });
            ta.addEventListener('click',()=>{ followCaret(); });
            // À la fermeture/perte de focus, on fige dans l'historique
            ta.addEventListener('blur',()=>{ pushHistory(); });
          }
          document.querySelectorAll('#lyr-voice-tabs .k').forEach(b=>{
            b.addEventListener('click',()=>{
              // Figer le texte courant dans l'historique avant de changer de voix
              pushHistory();
              lyrTrack=parseInt(b.dataset.lyrtrack,10);
              const newTa=document.getElementById('lyr-textarea');
              if(newTa)newTa.value=lyricsToText(lyrTrack);
              const nc=document.getElementById('lyr-note-count');
              if(nc)nc.innerHTML='Notes sur cette piste : <b>'+countNotes(lyrTrack)+'</b>';
              refreshTabHighlight();
              render();
            });
          });
        },
        onExtra:(w)=>{
          if(w==='Fermer'){ pushHistory(); closePanel(); return; }
        }
      });
    });
  })();

    const idx=state.sel.s;

    // et le remplace par des silences adaptes a la rythmique

      let start=idx;while(start>0&&meas[start-1].tupletId===tid)start--;

    openPanel({title:'N-uplet',body:controls(),hideActions:true,extraButtons:['Annuler','Appliquer'],
      onMount:()=>{

          b.addEventListener('click',()=>{chosenDur=parseFloat(b.dataset.tdur);refreshSel()});
        });
        document.querySelectorAll('[data-tn]').forEach(b=>{
          b.addEventListener('click',()=>{chosenN=parseInt(b.dataset.tn,10);refreshSel()});
        });
      },
      onExtra:(w)=>{
        if(w==='Annuler'){closePanel();return}
        if(w==='Appliquer'){
          const n=chosenN;
          // Vérifier que la zone consommée ne mord pas sur un autre n-uplet
          const totalSpace=2*chosenDur;
          const m=state.measures[state.sel.m];
          const idxLocal=state.sel.s;
          let consumed=0;
          for(let i=idxLocal;i<m.length&&consumed<totalSpace-1e-6;i++){
            if(m[i].tuplet&&i!==idxLocal){
              alert('Impossible : un autre n-uplet se trouve dans la zone occupee.');

  let nextTupletId=1;
  function applyTuplet(n,unitDur){
    // n-uplet de unitDur occupe l'espace de (n-1) notes de unitDur (règle 3:2 → 3 notes dans l'espace de 2)
    // Plus généralement : selon ratio implicite ABC (n:2 pour n impair, n:3 pour 6, etc.) — on garde 3:2 simple
    const ratio=2; // 3:2 → l'espace est de 2 unitDur
    const totalSpace=ratio*unitDur;
    const m=state.measures[state.sel.m];
    const idx=state.sel.s;
    const meter=meterAt(state.sel.m);
    const{den}=parseMeter(meter);
    const beat=4/den;
    const cap=measureCapacity(meter);
    // Calculer la position courante (offset)
    let offset=0;for(let i=0;i<idx;i++)offset+=effDur(m[i]);
    // Si l'espace disponible jusqu'à fin de mesure < totalSpace, on tronque (on garde le bouton désactivé sinon)
    const available=cap-offset;
    if(available<totalSpace-1e-6){alert('Pas assez de place dans la mesure pour ce n-uplet');return}
    // Identifiant unique pour ce groupe de n-uplet
    const tid=nextTupletId++;
    const activeSlot=m[idx];
    const isRest=(activeSlot.type==='rest');
    const newSlots=[];
    for(let i=0;i<n;i++){
      if(i===0){
        if(isRest){newSlots.push({type:'rest',dur:unitDur,dot:false,tuplet:n,tupletId:tid})}
        else{
          newSlots.push({type:'note',note:activeSlot.note,octave:activeSlot.octave,dur:unitDur,dot:false,acc:activeSlot.acc||'',tuplet:n,tupletId:tid});
        }
      } else {
        newSlots.push({type:'rest',dur:unitDur,dot:false,tuplet:n,tupletId:tid});
      }
    }
    // Consommer totalSpace à partir de idx (effacer/raccourcir les slots existants)
    let consumed=0;
    let cursor=idx;
    const eps=1e-6;
    while(consumed<totalSpace-eps&&cursor<m.length){
      const s=m[cursor];
      const d=effDur(s);
      if(consumed+d<=totalSpace+eps){
        consumed+=d;
        m.splice(cursor,1);
      } else {
        // découper le slot en deux : ce qu'on consomme + ce qui reste
        const remaining=d-(totalSpace-consumed);
        // remplacer ce slot par un silence (ou la note tronquée) à la durée restante
        const offsetAfter=offset+totalSpace;
        const pieces=splitDurationByBeat(offsetAfter,remaining,beat);
        const tail=pieces.map(p=>Object.assign({},s,{dur:p.dur,dot:p.dot}));
        m.splice(cursor,1,...tail);
        consumed=totalSpace;
        break;
      }
    }
    // Insérer les nouveaux slots à idx
    m.splice(idx,0,...newSlots);
    // Truncate/compléter la mesure
    truncateMeasureToCapacity(state.sel.m,cap);
    pushHistory();render();
  }

  // ⭐ −Mes : sélecteur de plage (de la mesure X → à la mesure Y), avec −10/−1/+1/+10

  // === Transformations rythmiques globales (toute la partition) ===
  function slotOffsets(meas){
    const offs=[];let cur=0;
    for(let i=0;i<meas.length;i++){offs.push(cur);cur+=effDur(meas[i])}
    return offs;
  }
  function onBeat(o,beat){const eps=1e-6;const r=o%beat;return r<eps||Math.abs(r-beat)<eps}
  // === Reorganisation rythmique : fusionne notes/silences contigus en valeurs plus simples ===
  // Ex : deux croches identiques liees -> une noire ; deux silences contigus -> un silence plus long.
  function isCleanValue(d){const e=1e-6;const bases=[4,2,1,0.5,0.25,0.125,0.0625];for(const b of bases){if(Math.abs(d-b)<e)return{dur:b,dot:false};if(Math.abs(d-b*1.5)<e)return{dur:b,dot:true}}return null}
  function consolidateRhythm(silent){
    let count=0;
    state.measures.forEach((meas,mi)=>{
      const meter=meterAt(mi);
      // Bloc rythmique de regroupement : noire en 3/4-4/4, noire pointee (grille croches) en 6/8.
      const beat=4/parseMeter(meter).den;
      // ---- Passe 1 : NOTES liees identiques -> valeurs plus longues (ex. 2 noires liees -> blanche)
      // On autorise les valeurs longues meme a travers les temps (blanche, ronde, pointees).
      let changed=true;
      while(changed){
        changed=false;
        for(let i=0;i<meas.length-1;i++){
          const a=meas[i],b=meas[i+1];
          if(a.tuplet||b.tuplet)continue;
          if(a.type!=='note'||b.type!=='note')continue;
          if(!a.tieToNext)continue;
          if(a.note!==b.note||a.octave!==b.octave||(a.acc||'')!==(b.acc||''))continue;
          if((a.orn&&a.orn.length)||(b.orn&&b.orn.length))continue;
          if(b.chord||b.text)continue;
          // Regle : ne PAS fusionner si la note de droite porte sa propre syllabe (on la perdrait).
          // Une continuation de scission n'a pas de parole (dropContinuationLyric) -> fusion autorisee.
          if(b.lyric||(b.verses&&b.verses.some(x=>x&&x.length)))continue;
          const cv=isCleanValue(effDur(a)+effDur(b));
          if(!cv)continue;
          const merged=Object.assign({},a,{dur:cv.dur,dot:cv.dot});
          if(b.tieToNext)merged.tieToNext=true;else delete merged.tieToNext;
          if(b.lyric&&!merged.lyric)merged.lyric=b.lyric;
          if(b.verses&&!merged.verses)merged.verses=b.verses.slice();
          if(a._selMark||b._selMark)merged._selMark=true;
          meas.splice(i,2,merged);
          count++;changed=true;break;
        }
      }
      // ---- Passe 2 : SILENCES -> recanonisation par plage, exactement comme une mesure neuve.
      // On detecte chaque plage continue de silences "simples" (sans ornement/accord/texte)
      // et on la remplace par la decomposition canonique splitDurationByBeat(offset,duree,beat).
      let i=0;
      while(i<meas.length){
        const s=meas[i];
        const simpleRest=(x)=>x&&x.type==='rest'&&!x.tuplet&&!(x.orn&&x.orn.length)&&!x.chord&&!x.text;
        if(!simpleRest(s)){i++;continue}
        // offset de debut de la plage
        const offs=slotOffsets(meas);
        const startOff=offs[i];
        let j=i,total=0,hadMark=false;
        while(j<meas.length&&simpleRest(meas[j])){total+=effDur(meas[j]);if(meas[j]._selMark)hadMark=true;j++}
        // recanoniser [i, j) si plus d'un silence OU si le decoupage canonique differe
        const pieces=splitDurationByBeat(startOff,total,beat).map(p=>({type:'rest',dur:p.dur,dot:!!p.dot}));
        // ne remplacer que si ca change vraiment (evite boucle/inutile)
        const sameLen=(j-i)===pieces.length;
        let identical=sameLen;
        if(sameLen){for(let k=0;k<pieces.length;k++){const o=meas[i+k];if(o.dur!==pieces[k].dur||!!o.dot!==pieces[k].dot){identical=false;break}}}
        if(!identical&&pieces.length){
          if(hadMark)pieces[0]._selMark=true;
          meas.splice(i,j-i,...pieces);
          count++;
          i+=pieces.length;
        } else {
          i=j;
        }
      }
    });
    if(!silent){
      if(count===0){alert('Reorganisation : rien a simplifier');return false}
      pushHistory();render();
    }
    return count>0;
  }
  function applySwingCore(matchFn,transformFn){
    let count=0;
    state.measures.forEach((meas,mi)=>{
      const beat=4/parseMeter(meterAt(mi)).den;
      let i=0;
      while(i<meas.length-1){
        const offs=slotOffsets(meas);
        if(onBeat(offs[i],beat)&&matchFn(meas,i,beat)){
          transformFn(meas,i,beat);
          count++;
          i+=2;continue;
        }
        i++;
      }
    });
    return count;
  }
  function applySwingGlobal(matchFn,transformFn,labelForAlert){
    let count=0;
    applyToAllTracks(()=>{count+=applySwingCore(matchFn,transformFn);});
    if(count===0){alert(labelForAlert+' : aucune occurrence trouvee');return false}
    pushHistory();render();return true;
  }
  function matchEqualPair(meas,i,beat){
    if(i>=meas.length-1)return false;
    const a=meas[i],b=meas[i+1];
    if(a.tuplet||b.tuplet)return false;
    if(a.dot||b.dot)return false;
    if(Math.abs(a.dur-b.dur)>1e-6)return false;
    if(Math.abs(2*a.dur-beat)>1e-6)return false;
    return true;
  }
  function grooveDot(){
    applySwingGlobal(matchEqualPair,(meas,i)=>{
      const a=meas[i],b=meas[i+1];
      meas[i]={...a,dur:a.dur,dot:true};
      meas[i+1]={...b,dur:b.dur/2,dot:false};
    },'2croches vers croche pointee+double');
  }
  function grooveTriplet(){
    applySwingGlobal(matchEqualPair,(meas,i)=>{
      const a=meas[i],b=meas[i+1];
      const tid=nextTupletId++;
      meas[i]={...a,dur:2*a.dur,dot:false,tuplet:3,tupletId:tid};
      meas[i+1]={...b,dur:b.dur,dot:false,tuplet:3,tupletId:tid};
    },'2croches vers triolet noire+croche');
  }
  function matchDotPair(meas,i,beat){
    if(i>=meas.length-1)return false;
    const a=meas[i],b=meas[i+1];
    if(a.tuplet||b.tuplet)return false;
    if(!a.dot||b.dot)return false;
    if(Math.abs(b.dur-a.dur/2)>1e-6)return false;

    return true;
  }
  function grooveUndot(){
    applySwingGlobal(matchDotPair,(meas,i)=>{
      const a=meas[i],b=meas[i+1];
      meas[i]={...a,dur:a.dur,dot:false};

  }
  function matchTripletPair(meas,i,beat){
    if(i>=meas.length-1)return false;
    const a=meas[i],b=meas[i+1];
    if(a.tuplet!==3||b.tuplet!==3||a.tupletId!==b.tupletId)return false;
    if(Math.abs(a.dur-2*b.dur)>1e-6)return false;
    if(Math.abs(2*b.dur-beat)>1e-6)return false;
    return true;
  }
  function grooveUntriplet(){
    applySwingGlobal(matchTripletPair,(meas,i)=>{
      const a=meas[i],b=meas[i+1];
      const na={...a,dur:b.dur,dot:false};delete na.tuplet;delete na.tupletId;
      const nb={...b,dur:b.dur,dot:false};delete nb.tuplet;delete nb.tupletId;
      meas[i]=na;meas[i+1]=nb;
    },'triolet noire+croche vers 2croches');
  }

  // === Materialisation des alterations implicites avant un decalage ===
  function materializeAccidentals(){
    state.measures.forEach((meas,mi)=>{
      const sig=keyAt(mi);
      meas.forEach((slot,si)=>{
        if(slot.type!=='note')return;
        if(slot.acc)return;
        let priorAcc=null;
        for(let k=si-1;k>=0;k--){
          const p=meas[k];
          if(p.type==='note'&&p.note===slot.note&&p.octave===slot.octave&&p.acc){priorAcc=p.acc;break}
        }
        if(priorAcc!==null){slot.acc=priorAcc;return}
        if(sig>0&&SHARP_NOTES.slice(0,sig).includes(slot.note))slot.acc='^';
        else if(sig<0&&FLAT_NOTES.slice(0,-sig).includes(slot.note))slot.acc='_';
      });
    });
  }

  // === Decalage global du morceau a partir de la note selectionnee ===
  function flattenSlots(){
    const out=[]; let absSel=-1; let markSel=-1;
    state.measures.forEach((m,mi)=>{
      m.forEach((sl,si)=>{
        if(sl._selMark)markSel=out.length;            // position réellement ciblée (multi-voix sûr)
        if(mi===state.sel.m&&si===state.sel.s)absSel=out.length;
        out.push({slot:sl,mIdx:mi,sIdx:si});
      });
    });
    const caps=state.measures.map((_,mi)=>measureCapacity(meterAt(mi)));
    // Si un slot est explicitement marqué (décalage à position donnée), il prime sur state.sel.
    return{slots:out,absSel:(markSel>=0?markSel:absSel),caps};
  }
  function rebuildMeasuresFromSlots(slots,caps){
    const result=[];
    let mi=0,used=0,curM=[];
    const eps=1e-6;
    function splitSlot(sl,want){
      const e=effDur(sl);
      if(want>=e-eps)return[sl,null];
      if(!sl.tuplet&&!sl.dot){
        const head={...sl,dur:want};
        const tail={...sl,dur:e-want,dot:false};
        if(sl.stack)tail.stack=sl.stack.map(x=>Object.assign({},x));
        if(sl.type==='note'){
          head.tieToNext=true;
          if(!sl.tieToNext)delete tail.tieToNext;
        }
        dropContinuationLyric(tail);
        return[head,tail];
      }
      if(sl.dot&&!sl.tuplet){
        const head={...sl,dur:want,dot:false};
        const tail={...sl,dur:e-want,dot:false};
        if(sl.stack)tail.stack=sl.stack.map(x=>Object.assign({},x));
        if(sl.type==='note'){
          head.tieToNext=true;
          if(!sl.tieToNext)delete tail.tieToNext;
        }
        dropContinuationLyric(tail);
        return[head,tail];
      }
      return[sl,null];
    }
    // Découpe une note/accord NON aligné sur les temps en figures liées par temps (notation lisible).

  // Re-barre une plage de mesures avec une nouvelle capacite, en preservant toutes les notes.
  // Genere autant de mesures que necessaire (debordement) ou aspire les notes suivantes (remplissage).
  function rebuildRangeWithCap(slots,newCap){
    const result=[];

      const e=effDur(sl);

        if(e<=remain+eps){
          curM.push(sl);used+=e;sl=null;
          if(used>=newCap-eps){result.push(curM);curM=[];used=0}
        } else {
          const[head,tail]=splitSlot(sl,remain);
          curM.push(head);used+=effDur(head);
          if(used>=newCap-eps){result.push(curM);curM=[];used=0}
          sl=tail;
        }

    }

        const pieces=splitDurationByBeat(used,remain,beat);
        pieces.forEach(p=>curM.push({type:'rest',dur:p.dur,dot:p.dot}));

  let newMeterGlobalTmp='4/4'; // utilise par rebuildRangeWithCap pour le beat des silences
  function meterChangeCore(newMeter,newUnit,endMOverride){
    const startM=state.sel.m;

    materializeAccidentals();
    // Frontiere de fin : soit imposee (plage X→Y), soit le prochain CHANGEMENT DE RYTHMIQUE.
    let endM=state.measures.length-1;
    for(let i=startM+1;i<state.measures.length;i++){
      if(state.timeChanges[i]!==undefined){endM=i-1;break}
    }
    let bounded=false, restoreMeter=null;
    if(endMOverride!==undefined&&endMOverride!==null&&endMOverride<endM){
      // Plage bornée : on capture le rythme effectif APRÈS la plage pour le restaurer.
      restoreMeter=meterAt(endMOverride+1);
      endM=endMOverride;bounded=true;
    }
    // Memoriser l'armure/cle de la 1ere mesure de la plage (a conserver)
    const keyAtStart=state.keyChanges[startM];
    const clefAtStart=state.clefChanges[startM];
    // Aplatir les slots de la plage [startM..endM]
    const flat=[];
    for(let i=startM;i<=endM;i++){for(const s of state.measures[i])flat.push(s)}

    const after=state.measures.slice(endM+1);
    const oldCount=endM-startM+1;
    const newCount=rebuilt.length;
    const delta=newCount-oldCount;
    state.measures=[...before,...rebuilt,...after];
    // Re-barrage : supprimer reprises/voltas de la plage. Pour armure/cle : garder seulement
    // celles de la 1ere mesure (startM), supprimer celles a l'interieur. Decaler ce qui est apres.
    const shiftMapDropInside=(obj,keepStart)=>{
      const out={};
      Object.keys(obj).forEach(k=>{
        const idx=parseInt(k,10);
        if(idx<startM)out[idx]=obj[k];
        else if(idx>endM)out[idx+delta]=obj[k];
        // dans [startM..endM] : supprime (la valeur de startM sera reposee si keepStart)
      });
      return out;
    };
    state.keyChanges=shiftMapDropInside(state.keyChanges);
    state.clefChanges=shiftMapDropInside(state.clefChanges);
    state.repeats=shiftMapDropInside(state.repeats);
    state.timeChanges=shiftMapDropInside(state.timeChanges);
    if(state.breaks)state.breaks=shiftMapDropInside(state.breaks);
    if(state.tempoChanges)state.tempoChanges=shiftMapDropInside(state.tempoChanges);
    // Reposer armure/cle sur la 1ere mesure de la plage (si elles existaient)
    if(keyAtStart!==undefined&&startM>0)state.keyChanges[startM]=keyAtStart;
    if(clefAtStart!==undefined&&startM>0)state.clefChanges[startM]=clefAtStart;

    } else {

    }
    // Plage bornée : restaurer le rythme d'origine juste après la plage re-barrée.
    if(bounded&&restoreMeter){

  function tupletGroupDur(mi,si){
    const meas=state.measures[mi];const t=meas[si];if(!t||!t.tuplet)return 0;
    let sum=0;
    for(let j=0;j<meas.length;j++){if(meas[j].tuplet&&meas[j].tupletId===t.tupletId)sum+=effDur(meas[j])}

  }
  // Renvoie true si un decalage a droite de duree d decouperait un n-uplet situe a la
  // selection ou apres : soit la selection est au milieu d'un n-uplet, soit un groupe
  // rencontre a une duree totale > d (il ne peut alors pas etre repositionne proprement).
  function tupletBlockingShift(d){
    const eps=1e-6;
    // 1) La selection est-elle au milieu d'un n-uplet (pas sur sa 1re note) ?
    const m0=state.measures[state.sel.m],s0=state.sel.s,t0=m0[s0];
    if(t0&&t0.tuplet){
      const prev=m0[s0-1];
      const atFirst=(s0===0)||!prev||!prev.tuplet||prev.tupletId!==t0.tupletId;
      if(!atFirst)return true;
    }
    // 2) Parcourir les n-uplets a partir de la selection ; bloquer si l'un a une duree > d
    const seen={};
    for(let mi=state.sel.m;mi<state.measures.length;mi++){
      const meas=state.measures[mi];
      const startS=(mi===state.sel.m)?state.sel.s:0;
      for(let si=startS;si<meas.length;si++){
        const t=meas[si];
        if(t&&t.tuplet&&!seen[t.tupletId]){
          seen[t.tupletId]=true;
          const gd=tupletGroupDur(mi,si);
          if(gd>d+eps)return true;
        }
      }
    }
    return false;
  }
  // Variante position-explicite (utilisée par le décalage multi-voix).
  function tupletBlockingShiftAt(posM,posS,d){
    const eps=1e-6;
    const m0=state.measures[posM],t0=m0&&m0[posS];
    if(t0&&t0.tuplet){
      const prev=m0[posS-1];
      const atFirst=(posS===0)||!prev||!prev.tuplet||prev.tupletId!==t0.tupletId;
      if(!atFirst)return true;
    }
    const seen={};
    for(let mi=posM;mi<state.measures.length;mi++){
      const meas=state.measures[mi];
      const startS=(mi===posM)?posS:0;
      for(let si=startS;si<meas.length;si++){
        const t=meas[si];
        if(t&&t.tuplet&&!seen[t.tupletId]){seen[t.tupletId]=true;const gd=tupletGroupDur(mi,si);if(gd>d+eps)return true;}
      }
    }
    return false;
  }
  // Nettoie les liaisons rendues invalides par une édition (décalage, suppression…) :
  // un tie n'est valable que si la note suivante (même mesure, sinon 1re de la suivante)
  // partage AU MOINS une hauteur. Une liaison « coupée » est retirée — y compris l'intention
  // de lien (linkToNext/_linkKind) si c'était un tie — pour ne pas réapparaître en slur.
  // Les scissions sur barre (tieToNext sans linkToNext, même hauteur) restent valides.
  function cleanupTies(){
    const saved=state.activeTrack;
    for(let ti=0;ti<state.tracks.length;ti++){
      state.activeTrack=ti;
      const measures=state.measures;
      for(let mi=0;mi<measures.length;mi++){
        const meas=measures[mi];const sig=keyAt(mi);
        for(let si=0;si<meas.length;si++){
          const t=meas[si];
          if(!t||t.type!=='note'||!t.tieToNext)continue;
          let nM=mi,nI=si+1;
          if(nI>=meas.length){nM=mi+1;nI=0;}
          const nMeas=measures[nM];const nx=nMeas&&nMeas[nI];
          let valid=false;
          if(nx&&nx.type==='note'){
            const a=slotMidiSet(meas,si,sig);
            const b=slotMidiSet(nMeas,nI,keyAt(nM));
            if(a&&b&&a.some(v=>b.indexOf(v)>=0))valid=true;
          }
          if(!valid){
            delete t.tieToNext;delete t.slurToNext;
            if(t._linkKind==='tie'){delete t.linkToNext;delete t._linkKind;}
          }
        }
      }
    }
    state.activeTrack=saved;
  }

  function shiftPiece(direction,shiftDur,shiftDot,scope){
    if(scope==='all'){
      // Décalage sur TOUTES les voix, au même INSTANT que la sélection courante (pas au même index).
      const selM=state.sel.m, selS=state.sel.s;
      const saved0=state.activeTrack;
      // Décalage temporel cible (en noires) du curseur dans sa mesure, sur la voix active.

      {const tr=state.tracks[saved0];const meas=tr&&tr.measures&&tr.measures[selM];if(meas)for(let k=0;k<selS&&k<meas.length;k++)targetOff+=effDur(meas[k]);}
      // Pour chaque voix, l'index du slot où insérer le décalage : celui qui COMMENCE à l'instant,
      // ou à défaut celui qui CONTIENT l'instant (le silence s'insère alors avant cette note, ce qui
      // pousse cette note et la suite vers la droite). -1 seulement si l'instant est hors mesure.
      function slotForShiftAt(meas,off){if(!meas)return -1;const eps=1e-6;let o=0;for(let i=0;i<meas.length;i++){const d=effDur(meas[i]);if(off>=o-eps&&off<o+d-eps)return i;o+=d;}

      }

  // Cœur du décalage sur la voix active, à la position (posM,posS). silent=true évite les alertes.
  // noSelUpdate=true : ne touche PAS à state.sel (indispensable en mode toutes-voix, sinon la sélection
  // est ré-clampée contre chaque voix successivement et corrompt l'itération).
  function shiftCore(direction,shiftDur,shiftDot,posM,posS,silent,noSelUpdate){
    const target=state.measures[posM]&&state.measures[posM][posS];

    const eshift=shiftDot?shiftDur*1.5:shiftDur;
    if(direction>0){
      if(tupletBlockingShiftAt(posM,posS,eshift)){if(!silent)alert('Décalage impossible : la durée choisie est inférieure à celle d\u2019un n-uplet,\nqui ne peut pas être découpé. Choisissez une durée au moins égale au n-uplet.');return false}

  }

  // Transpose une note (tête ou note d'accord) de n demi-tons, en figistant l'altération absolue.
  function transposeNoteObj(o,semitones,preferFlats){
    const baseSemi={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
    let midi=60+baseSemi[o.note]+o.octave*12;
    if(o.acc==='^')midi+=1;else if(o.acc==='_')midi-=1;
    const out=midiToNote(midi+semitones,preferFlats);
    o.note=out.note;o.octave=out.octave;o.acc=out.acc;
  }
  // Transpose une PLAGE de slots (de from..to inclus, indices globaux) de la voix active.
  function transposeRange(fromIdx,toIdx,semitones){
    const preferFlats=(semitones<0);
    freezeAccidentals();
    const flat=flatSlots();
    if(fromIdx>toIdx){const t=fromIdx;fromIdx=toIdx;toIdx=t;}
    for(let i=fromIdx;i<=toIdx&&i<flat.length;i++){
      const slot=flat[i].slot;
      if(slot.type!=='note')continue;
      transposeNoteObj(slot,semitones,preferFlats);
      if(slot.stack&&slot.stack.length)slot.stack.forEach(o=>transposeNoteObj(o,semitones,preferFlats));
    }
    // Réécrit les altérations (ajoute les bécarres nécessaires, retire les redondances).
    respellAccidentals();
  }
  // Copie une plage (clones) dans noteClip.
  function copyRange(fromIdx,toIdx){
    const flat=flatSlots();
    if(fromIdx>toIdx){const t=fromIdx;fromIdx=toIdx;toIdx=t;}
    noteClip=[];
    for(let i=fromIdx;i<=toIdx&&i<flat.length;i++)noteClip.push(cloneSlot(flat[i].slot));
  }
  // Colle (ÉCRASE) la portion à partir de l'index global startIdx, sans changer la grille de mesures :
  // on remplace les slots un à un. La durée des slots collés peut différer ; on remplit tant que des
  // slots existent et qu'on n'a pas dépassé la capacité — sinon on s'arrête (pas d'insertion).
  function pasteOverwriteAt(startIdx){
    if(!noteClip||!noteClip.length)return false;
    const flat=flatSlots();
    // Séquence cible : avant + portion collée (écrase) + reste après. Si le collage dépasse
    // la fin du morceau, l'excédent le prolonge (mesures ajoutées) au lieu d'être perdu.
    const before=flat.slice(0,startIdx).map(f=>cloneSlot(f.slot));
    const pasted=noteClip.map(s=>cloneSlot(s));
    const after=flat.slice(startIdx+noteClip.length).map(f=>cloneSlot(f.slot));
    const newSlots=before.concat(pasted,after);
    // Capacités : assez de mesures pour tout contenir (extension avec la métrique de la dernière mesure).
    const caps=state.measures.map((_,mi)=>measureCapacity(meterAt(mi)));
    const lastCap=measureCapacity(meterAt(Math.max(0,state.measures.length-1)))||4;
    const totalDur=newSlots.reduce((a,s)=>a+effDur(s),0);
    let capSum=caps.reduce((a,b)=>a+b,0);
    while(capSum<totalDur-1e-6){caps.push(lastCap);capSum+=lastCap;}
    state.measures=rebuildMeasuresFromSlots(newSlots.map(s=>({slot:s})),caps);
    cleanupAccidentals();
    return true;
  }
