  let cOnOk=null,cOnExtra=null,cOnMeasureChange=null,cShowMes=false;

  // === Sélecteur de plage de mesures partagé (de la mesure X → à la mesure Y) ===
  // Chaque ligne (« de la » / « à la ») a ses propres boutons −10 −1 +1 +10.
  // Un bouton ne modifie QUE la valeur de SA ligne (jamais les deux), allume SA ligne en bleu,
  // et positionne la vue sur la mesure de cette ligne. Le libellé est un simple texte.
  // opts: {from, to, min, max, focus, onChange(from,to,focus)}. Renvoie {html, bind, getFrom, getTo}.
  function makeRangeSelector(opts){
    let from=opts.from, to=opts.to, active=opts.focus||'to'; // champ sélectionné ('from' ou 'to')
    const min=opts.min!=null?opts.min:1, max=opts.max;
    function clamp(driver){
      from=Math.max(min,Math.min(max,from));
      to=Math.max(min,Math.min(max,to));
      if(driver==='from'){ if(from>to)to=from; }
      else if(driver==='to'){ if(to<from)from=to; }
      else { if(to<from)to=from; }
    }
    function html(){
      clamp();
      function fieldRow(which,label,val){
        // Ligne sélectionnable : libellé + valeur. Un clic la rend « active ».
        return '<button class="k rg-field" data-rg="'+which+'" style="display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;height:30px;font-size:13px;font-weight:700;text-align:left;padding:0 10px;margin-top:3px;">'
          +'<span>'+label+'</span><span class="rg-val" data-rg="'+which+'" style="font-size:15px;">'+val+'</span></button>';
      }
      // Une SEULE ligne de boutons partagée : −10 −1 déb fin +1 +10, agissant sur le champ sélectionné.
      const stepRow='<div class="rg-steps" style="display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px;">'
        +'<button class="k rg-step" data-d="-10" style="font-size:12px;padding:0;">−10</button>'
        +'<button class="k rg-step" data-d="-1" style="font-size:13px;padding:0;">−1</button>'
        +'<button class="k rg-step" data-set="min" style="font-size:12px;padding:0;">déb</button>'
        +'<button class="k rg-step" data-set="max" style="font-size:12px;padding:0;">fin</button>'
        +'<button class="k rg-step" data-d="1" style="font-size:13px;padding:0;">+1</button>'
        +'<button class="k rg-step" data-d="10" style="font-size:12px;padding:0;">+10</button>'
        +'</div>';
      // Plus de boutons −10/−1/déb/fin/+1/+10 ici (doublon de la barre) : on règle la borne active
      // avec la barre de déplacement principale, ou en touchant une mesure sur la partition. stepRow non utilisé.
      const hint='<div style="font-size:13px;color:#555;margin-top:6px;text-align:center;line-height:1.25;">Touchez « De la » ou « à la », puis réglez avec la barre&nbsp;← ⟪ -10 Deb Fin +10 ⟫ →&nbsp;(ou touchez une mesure).</div>';
      return '<div class="rg-wrap">'+fieldRow('from','De la mesure',from)+fieldRow('to','à la mesure',to)+hint+'</div>';
    }
    function refresh(root){
      clamp();
      root.querySelectorAll('.rg-val').forEach(el=>{el.textContent=(el.dataset.rg==='from')?from:to;});
      // Le champ actif (de/à) est surligné en bleu
      root.querySelectorAll('.rg-field').forEach(b=>{
        const on=(b.dataset.rg===active);
        b.style.background=on?'#cfe5fa':'';b.style.borderColor=on?'#185fa5':'';b.style.color=on?'#0c447c':'';
      });
    }
    function applyDelta(d){ if(active==='from')from+=d; else to+=d; clamp(active); }
    function applySet(kind){ const v=(kind==='min')?min:max; if(active==='from')from=v; else to=v; clamp(active); }
    function bind(root){
      // Sélection du champ (de / à)
      root.querySelectorAll('.rg-field').forEach(b=>b.addEventListener('click',()=>{
        active=b.dataset.rg;
        if(opts.onChange)opts.onChange(from,to,active);
        refresh(root);
      }));
      // Ligne de boutons partagée : modifie le champ actif
      root.querySelectorAll('.rg-step').forEach(b=>b.addEventListener('click',()=>{
        if(b.dataset.set){ applySet(b.dataset.set); }
        else { applyDelta(parseInt(b.dataset.d,10)); }
        if(opts.onChange)opts.onChange(from,to,active);
        refresh(root);
      }));
      refresh(root);
      // Clic sur une mesure de la partition → met à jour le champ actif
      state._rangePick=(measureIdx1based)=>{
        if(active==='from')from=measureIdx1based; else to=measureIdx1based;
        clamp(active);
        if(opts.onChange)opts.onChange(from,to,active);
        refresh(root);
      };
    }
    return {html,bind,refresh,getFrom:()=>from,getTo:()=>to,getActive:()=>active,setFrom:v=>{from=v;clamp();},setTo:v=>{to=v;clamp();}};
  }

  function openPanel({title,body,onMount,onOk,hideActions,extraButtons,onExtra,actionsClass,showMes,onMeasureChange,fullHeight,compact,closeTop}){
    panelTitle.textContent=title;
    {const ct=document.getElementById('panel-close-top');if(ct)ct.style.display=closeTop?'':'none';}
    cShowMes=!!showMes;
    panelMes.textContent=cShowMes?('Mes '+(state.sel.m+1)):'';
    document.getElementById('panel-nav').style.display='none';
    let eH='';
    if(extraButtons&&extraButtons.length){
      let cls='actions';
      if(actionsClass)cls+=' '+actionsClass;
      else if(extraButtons.length===3)cls+=' three';
      else if(extraButtons.length===4)cls+=' four';
      eH='<div class="'+cls+'" style="margin-top:10px;">'+extraButtons.map((b,i)=>'<button class="k '+(i===extraButtons.length-1?'primary':'')+'" data-extra="'+b.replace(/"/g,'&quot;')+'">'+b+'</button>').join('')+'</div>';
    }
    panelBody.innerHTML=body+eH;
    cOnOk=onOk||null;cOnExtra=onExtra||null;cOnMeasureChange=onMeasureChange||null;
    panelOk.style.display=(hideActions||extraButtons)?'none':'';
    panelCancel.style.display=(hideActions||extraButtons)?'none':'';
    panel.classList.add('open');
    // Positionnement PC : la popup recouvre la colonne de menu, son haut au niveau des onglets
    // (la barre de navigation ← ⟪ Deb Fin ⟫ → reste accessible au-dessus). Son bas s'arrête
    // juste au-dessus de la rangée Annuler/Refaire (↶ ↷) de l'onglet actif, pour la garder
    // accessible elle aussi.
    try{
      const left=document.querySelector('.pc-left');
      const tabs=document.querySelector('.pc-left .tabs');
      if(left&&tabs){
        const lr=left.getBoundingClientRect();
        const tr=tabs.getBoundingClientRect();
        panel.style.left=lr.left+'px';
        panel.style.width=lr.width+'px';
        panel.style.top=tr.top+'px';
        if(compact){
          // Hauteur naturelle : le popup s'ajuste a son contenu (pas d'etirement vertical),
          // ancre sous les onglets, avec un plafond pour ne pas deborder l'ecran.
          panel.style.bottom='auto';
          panel.style.maxHeight=(window.innerHeight - tr.top - 12)+'px';
        } else {
        // Bas du popup : par defaut juste au-dessus de la rangee Annuler/Refaire (↶ ↷) de
        // l'onglet actif, pour la garder accessible. Mais si fullHeight est demande, ou si
        // l'onglet actif n'a pas de rangee undo/redo, le popup descend jusqu'a la marge basse.
        let undoRow=null;
        if(!fullHeight){
          const activePanel=document.querySelector('.tab-panel[data-panel="'+state.activeTab+'"]')||document.querySelector('.tab-panel');
          if(activePanel){
            const rows=activePanel.querySelectorAll('.row-grid');
            rows.forEach(r=>{if(r.querySelector('[id^="btn-undo"]'))undoRow=r;});
          }
        }
        if(undoRow){
          const ur=undoRow.getBoundingClientRect();
          const bottomPx=Math.max(12, window.innerHeight - ur.top + 8);
          panel.style.bottom=bottomPx+'px';
        } else {
          panel.style.bottom='12px';
        }
        panel.style.maxHeight='none';
        }
      }
    }catch(_){ }
    if(onMount)setTimeout(onMount,50);
    if(extraButtons)setTimeout(()=>{panelBody.querySelectorAll('[data-extra]').forEach(b=>{b.addEventListener('click',()=>{if(cOnExtra)cOnExtra(b.dataset.extra)})})},50);
  }
  function closePanel(){panel.classList.remove('open');panel.style.top='';panel.style.bottom='';panel.style.left='';panel.style.width='';panel.style.maxHeight='';{const ct=document.getElementById('panel-close-top');if(ct)ct.style.display='none';}cOnOk=null;cOnExtra=null;cOnMeasureChange=null;cShowMes=false;state._rangePick=null;state._notePick=null;state._noteRangeHL=null;state._measRangeHL=null;state._scopeSync=null;const wasChord=state._chordEditMode;if(wasChord){const sl=selectedSlot();if(sl&&sl.type==='note')dedupeChord(sl);}state._chordEditMode=false;state._chordAddPending=false;if(wasChord)renderScore()}
  function notifyPanelMeasureChanged(){
    if(!panel.classList.contains('open'))return;
    if(cShowMes)panelMes.textContent='Mes '+(state.sel.m+1);
    // La barre de déplacement principale pilote la borne active du sélecteur de plage (si présent).
    if(state._rangePick)state._rangePick(state.sel.m+1);
    if(cOnMeasureChange)cOnMeasureChange();
  }
  panelOk.addEventListener('click',()=>{if(cOnOk)cOnOk();closePanel();render()});
  panelCancel.addEventListener('click',closePanel);
  {const ct=document.getElementById('panel-close-top');if(ct)ct.addEventListener('click',closePanel);}
  // Stepper de navigation entre mesures dans le panel
  document.getElementById('panel-nav-prev').addEventListener('click',()=>{
    if(state.sel.m>0){state.sel.m--;state.sel.s=0;render()}
  });
  document.getElementById('panel-nav-next').addEventListener('click',()=>{
    if(state.sel.m<state.measures.length-1){state.sel.m++;state.sel.s=0;render()}
  });

  // ⭐ Headers : Titre/X simple input, ST/C/N multilignes avec bouton ↵
  function headerPromptSimple(key,title){return ()=>openPanel({title:title,body:'<div class="row"><input id="hi" type="text" value="'+((state.headers[key]||'')+'').replace(/"/g,'&quot;')+'"/></div>',onMount:()=>document.getElementById('hi').focus(),onOk:()=>{let v=document.getElementById('hi').value.trim();if(key==='X'&&!v)v='0';state.headers[key]=v;pushHistory()}})}
  function headerPromptMulti(key,title,opts){opts=opts||{};return ()=>{
    const big=!!opts.big;
    const taStyle=big?'min-height:240px;height:240px;':'height:auto;min-height:0;';
    const rows=big?12:3;
    openPanel({
      title:title,
      compact:!big,
      body:'<textarea id="hi" rows="'+rows+'" style="'+taStyle+'">'+((state.headers[key]||'')+'').replace(/</g,'&lt;')+'</textarea>'+
        (big?'':'<div class="row-grid" style="margin-top:8px;"><button class="k" id="newline-btn" style="font-size:14px;">↵ Nouvelle ligne</button></div>'),
      onMount:()=>{
        const ta=document.getElementById('hi');
        ta.focus();
        const nb=document.getElementById('newline-btn');
        if(nb)nb.addEventListener('click',()=>{
          const pos=ta.selectionStart;
          const v=ta.value;
          ta.value=v.substring(0,pos)+'\n'+v.substring(pos);
          ta.selectionStart=ta.selectionEnd=pos+1;
          ta.focus();
        });
      },
      onOk:()=>{const _nv=document.getElementById('hi').value.trim();if(key==='T'&&_nv!==((state.headers.T||'')+''))state.nameFromTitle=true;state.headers[key]=_nv;pushHistory()}
    });
  }}

  document.querySelector('[data-hdr="C"]').addEventListener('click',headerPromptMulti('C','Compositeur'));

  {const rb=document.querySelector('[data-hdr="R"]');if(rb)rb.addEventListener('click',headerPromptSimple('R','R: Type de rythme (Reel, Jig, Slide…)'));}
  {const hb=document.querySelector('[data-hdr="H"]');if(hb)hb.addEventListener('click',headerPromptMulti('H','Historique / source (H:)'));}
  {const fb=document.querySelector('[data-hdr="F"]');if(fb)fb.addEventListener('click',headerPromptSimple('F','URL du fichier (F:)'));}
  {const zb=document.querySelector('[data-hdr="Z"]');if(zb)zb.addEventListener('click',headerPromptSimple('Z','Transcripteur (Z:)'));}
  {const pb=document.querySelector('[data-hdr="P"]');if(pb)pb.addEventListener('click',headerPromptSimple('P','Ordre des parties (P:, ex. (2A2B))'));}
  {const svb=document.getElementById('btn-scoreversion');if(svb)svb.addEventListener('click',headerPromptSimple('scoreVersion','Version de la partition (ex. 1.0.17 du 11/06/2026)'));}


  // ⭐ Rythme : applique sur une PLAGE de mesures (X→Y), sur toutes les voix
  document.querySelector('[data-hdr="M"]').addEventListener('click',()=>{
    function getCurrent(){const cur=meterAt(state.sel.m);const{num,den}=parseMeter(cur);return{n:num,d:den,uD:parseInt(state.pieceUnit.split('/')[1],10)}}
    let st=getCurrent();
    const dV=[1,2,4,8,16];
    const uDs=[1,2,4,8,16,32];
    const rg=makeRangeSelector({from:state.sel.m+1,to:state.sel.m+1,min:1,max:state.measures.length,focus:'to',
      onChange:(f,t,focus)=>{const m=(focus==='from'?f:t)-1;if(m>=0&&m<state.measures.length){state.sel={m,s:0};st=getCurrent();const nv=document.getElementById('num-v');if(nv)nv.textContent=st.n;const dv=document.getElementById('den-v');if(dv)dv.textContent=st.d;const lv=document.getElementById('L-v');if(lv)lv.textContent=st.uD;renderScore();renderState();ensureSelectionVisible();}}});
    function controls(){
      function inlineStep(label,idD,idV,val,idU){
        return '<div class="stepper-inline">'
          +'<span class="si-label">'+label+'</span>'
          +'<button class="k" id="'+idD+'">−</button>'
          +'<div class="val"><b id="'+idV+'">'+val+'</b></div>'
          +'<button class="k" id="'+idU+'">+</button></div>';
      }
      return '<div class="mes-active" style="color:#8a5a00;">⊕ S\'applique à <b>toutes les voix</b></div>'+rg.html()+
        '<div class="rythme-compact">'+
          inlineStep('Numérateur','num-d','num-v',st.n,'num-u')+
          inlineStep('Dénominateur','den-d','den-v',st.d,'den-u')+
          inlineStep('Unité L:1/x','L-d','L-v',st.uD,'L-u')+
        '</div>';
    }
    function rebind(){
      rg.bind(document.getElementById('panel-body'));
      document.getElementById('num-u').addEventListener('click',()=>{st.n=Math.min(16,st.n+1);document.getElementById('num-v').textContent=st.n});
      document.getElementById('num-d').addEventListener('click',()=>{st.n=Math.max(1,st.n-1);document.getElementById('num-v').textContent=st.n});
      document.getElementById('den-u').addEventListener('click',()=>{const i=dV.indexOf(st.d);if(i<dV.length-1){st.d=dV[i+1];document.getElementById('den-v').textContent=st.d}});
      document.getElementById('den-d').addEventListener('click',()=>{const i=dV.indexOf(st.d);if(i>0){st.d=dV[i-1];document.getElementById('den-v').textContent=st.d}});
      document.getElementById('L-u').addEventListener('click',()=>{const i=uDs.indexOf(st.uD);if(i<uDs.length-1){st.uD=uDs[i+1];document.getElementById('L-v').textContent=st.uD}});
      document.getElementById('L-d').addEventListener('click',()=>{const i=uDs.indexOf(st.uD);if(i>0){st.uD=uDs[i-1];document.getElementById('L-v').textContent=st.uD}});
    }
    openPanel({
      title:'Rythme',body:controls(),hideActions:true,extraButtons:['Annuler','Appliquer'],
      onMount:rebind,
      onExtra:(w)=>{
        if(w==='Annuler'){closePanel();return}
        const startMi=Math.min(rg.getFrom(),rg.getTo())-1;
        const endMi=Math.max(rg.getFrom(),rg.getTo())-1;
        state.sel={m:startMi,s:0};
        const endOverride=(endMi<state.measures.length-1)?endMi:undefined;
        applyToAllTracks(()=>meterChangeCore(st.n+'/'+st.d,'1/'+st.uD,endOverride));
        pushHistory();closePanel();render();
      }
    });
  });

  // ⭐ Armure : applique sur une PLAGE de mesures (X→Y), à son constant (réécriture d'affichage)
  document.querySelector('[data-hdr="K"]').addEventListener('click',()=>{
    let sig=keyAt(state.sel.m);
    const rg=makeRangeSelector({from:state.sel.m+1,to:state.sel.m+1,min:1,max:state.measures.length,focus:'to',
      onChange:(f,t,focus)=>{const m=(focus==='from'?f:t)-1;if(m>=0&&m<state.measures.length){state.sel={m,s:0};sig=keyAt(m);const sv=document.getElementById('sig-v');if(sv)sv.textContent=keyMajMinLabel(sig);renderScore();renderState();ensureSelectionVisible();}}});
    function controls(){
      return '<div class="mes-active" style="color:#8a5a00;">⊕ S\'applique à <b>toutes les voix</b></div>'+rg.html()+
        '<div class="stepper-label">Armure (Majeur / mineur)</div><div class="stepper"><button class="k" id="sig-d">♭</button><div class="val"><b id="sig-v" style="font-size:13px;">'+keyMajMinLabel(sig)+'</b></div><button class="k" id="sig-u">♯</button></div>';
    }
    function rebind(){
      rg.bind(document.getElementById('panel-body'));
      document.getElementById('sig-u').addEventListener('click',()=>{sig=Math.min(7,sig+1);document.getElementById('sig-v').textContent=keyMajMinLabel(sig)});
      document.getElementById('sig-d').addEventListener('click',()=>{sig=Math.max(-7,sig-1);document.getElementById('sig-v').textContent=keyMajMinLabel(sig)});
    }
    openPanel({
      title:'Armure',body:controls(),hideActions:true,extraButtons:['Annuler','Appliquer'],
      onMount:rebind,
      onExtra:(w)=>{
        if(w==='Annuler'){closePanel();return}
        const startMi=Math.min(rg.getFrom(),rg.getTo())-1;
        const endMi=Math.max(rg.getFrom(),rg.getTo())-1;
        applyToAllTracks(()=>{
          const sigAfter=keyAt(Math.min(endMi+1,state.measures.length-1));
          const hadExplicitAfter=state.keyChanges[endMi+1]!==undefined;
          respellRangeForKey(startMi,endMi,sig);
          if(startMi===0){state.pieceKeySig=sig;delete state.keyChanges[0];}
          else state.keyChanges[startMi]=sig;
          for(let mi=startMi+1;mi<=endMi;mi++)delete state.keyChanges[mi];
          if(endMi+1<state.measures.length&&!hadExplicitAfter&&sigAfter!==sig){
            state.keyChanges[endMi+1]=sigAfter;
          }
          cleanupAccidentals();
        });
        state.sel={m:startMi,s:0};
        pushHistory();closePanel();render();
      }
    });
  });

  // ⭐ Clé : applique sur une PLAGE de mesures (X→Y), voix active uniquement. Son conservé.
  document.querySelector('[data-hdr="CLEF"]').addEventListener('click',()=>{
    let pick=clefAt(state.sel.m);
    const rg=makeRangeSelector({from:state.sel.m+1,to:state.sel.m+1,min:1,max:state.measures.length,focus:'to',
      onChange:(f,t,focus)=>{const m=(focus==='from'?f:t)-1;if(m>=0&&m<state.measures.length){state.sel={m,s:0};pick=clefAt(m);document.querySelectorAll('#clef-pick .k[data-clef], #clef-others-row .k[data-clef]').forEach(b=>b.classList.toggle('active',b.dataset.clef===pick));renderScore();renderState();ensureSelectionVisible();}}});
    function controls(){
      const showOthers=(pick==='alto'||pick==='tenor');
      return '<div class="mes-active" style="color:#0c6b2f;">◆ S\'applique à la <b>voix active</b></div>'+rg.html()+
      '<div class="stepper-label">Clé</div>'+
      '<div class="row-grid row-4" id="clef-pick"><button class="k clef-small" data-clef="treble">𝄞</button><button class="k clef-small" data-clef="treble8" title="Sol octaviée (sonne une octave plus bas)"><svg width="20" height="30" viewBox="0 0 20 30" style="vertical-align:middle;"><text x="10" y="21" font-size="23" font-family="serif" text-anchor="middle" fill="currentColor">𝄞</text><text x="10" y="29" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle" fill="currentColor">8</text></svg></button><button class="k clef-small" data-clef="bass">𝄢</button><button class="k" id="clef-others" title="Clés d\'ut (alto, ténor)" style="font-size:12px;">Autres ▾</button></div>'+
      '<div class="row-grid row-2" id="clef-others-row" style="margin-top:3px;'+(showOthers?'':'display:none;')+'">'+
        '<button class="k clef-small" data-clef="alto" title="Clé d\'ut 3e ligne (alto)"><svg width="34" height="30" viewBox="0 0 34 30" style="vertical-align:middle;"><text x="11" y="15" font-size="21" font-family="serif" text-anchor="middle" dominant-baseline="central" fill="currentColor">𝄡</text><text x="26" y="15" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" fill="currentColor">alto</text></svg></button>'+
        '<button class="k clef-small" data-clef="tenor" title="Clé d\'ut 4e ligne (ténor)"><svg width="40" height="30" viewBox="0 0 40 30" style="vertical-align:middle;"><text x="11" y="15" font-size="21" font-family="serif" text-anchor="middle" dominant-baseline="central" fill="currentColor">𝄡</text><text x="29" y="15" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" fill="currentColor">tén.</text></svg></button>'+
        '<button class="k clef-small" data-clef="perc" title="Percussion (batterie)"><svg width="30" height="30" viewBox="0 0 30 30" style="vertical-align:middle;"><rect x="7" y="8" width="3" height="14" fill="currentColor"/><rect x="12" y="8" width="3" height="14" fill="currentColor"/><text x="23" y="15" font-size="8" font-weight="bold" font-family="sans-serif" text-anchor="middle" dominant-baseline="central" fill="currentColor">perc</text></svg></button>'+
        '<button class="k clef-small" data-clef="treble+8" title="Sol +8 (sonne une octave plus haut)"><svg width="20" height="30" viewBox="0 0 20 30" style="vertical-align:middle;"><text x="10" y="9" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle" fill="currentColor">8</text><text x="10" y="28" font-size="22" font-family="serif" text-anchor="middle" fill="currentColor">𝄞</text></svg></button>'+
        '<button class="k clef-small" data-clef="bass+8" title="Fa +8 (sonne une octave plus haut)"><svg width="20" height="30" viewBox="0 0 20 30" style="vertical-align:middle;"><text x="10" y="9" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle" fill="currentColor">8</text><text x="10" y="26" font-size="19" font-family="serif" text-anchor="middle" fill="currentColor">𝄢</text></svg></button>'+
        '<button class="k clef-small" data-clef="bass-8" title="Fa −8 (sonne une octave plus bas)"><svg width="20" height="30" viewBox="0 0 20 30" style="vertical-align:middle;"><text x="10" y="19" font-size="19" font-family="serif" text-anchor="middle" fill="currentColor">𝄢</text><text x="10" y="29" font-size="8" font-weight="bold" font-family="serif" text-anchor="middle" fill="currentColor">8</text></svg></button>'+
      '</div>'}
    function rebind(){
      rg.bind(document.getElementById('panel-body'));
      const rf=()=>document.querySelectorAll('#clef-pick .k[data-clef], #clef-others-row .k[data-clef]').forEach(b=>b.classList.toggle('active',b.dataset.clef===pick));
      rf();
      document.querySelectorAll('#clef-pick .k[data-clef], #clef-others-row .k[data-clef]').forEach(b=>b.addEventListener('click',()=>{pick=b.dataset.clef;rf()}));
      const ob=document.getElementById('clef-others');
      if(ob)ob.addEventListener('click',()=>{const row=document.getElementById('clef-others-row');if(row)row.style.display=(row.style.display==='none')?'':'none';});
    }
    openPanel({
      title:'Clé',body:controls(),hideActions:true,extraButtons:['Annuler','Appliquer'],
      onMount:rebind,
      onExtra:(w)=>{
        if(w==='Annuler'){closePanel();return}
        // Son conservé : on compense l'octaviation de la clé (sol-8 = -1 octave) pour garder la même hauteur réelle.
        // Plage X→Y : on pose la clé au début, on nettoie l'intérieur, et on restaure après.
        const startMi=Math.min(rg.getFrom(),rg.getTo())-1;
        const endMi=Math.max(rg.getFrom(),rg.getTo())-1;
        const clefAfter=clefAt(Math.min(endMi+1,state.measures.length-1));
        const hadAfter=state.clefChanges[endMi+1]!==undefined;
        const _oldClefs={};for(let mi=startMi;mi<=endMi;mi++)_oldClefs[mi]=clefAt(mi);
        if(startMi===0){state.pieceClef=pick;delete state.clefChanges[0]}if(pick==='perc'){const _tk=state.tracks[state.activeTrack];if(_tk&&!_tk.percMap)_tk.percMap=defaultDrumKit();}
        else state.clefChanges[startMi]=pick;
        for(let mi=startMi+1;mi<=endMi;mi++)delete state.clefChanges[mi];
        if(endMi+1<state.measures.length&&!hadAfter&&clefAfter!==pick){
          state.clefChanges[endMi+1]=clefAfter;
        }
        // Hauteur reelle conservee : on compense l'octaviation de la cle (ex. sol-8 -> fa = -1 octave).
        for(let mi=startMi;mi<=endMi;mi++){const d=(clefSoundShift(_oldClefs[mi])-clefSoundShift(pick))/12;if(d){const meas=state.measures[mi];if(meas)meas.forEach(t=>{if(t.type==='note'){t.octave+=d;if(t.stack)t.stack.forEach(sn=>{sn.octave+=d})}});}}
        state.sel={m:startMi,s:0};
        cleanupAccidentals();pushHistory();closePanel();render();
      }
    });
  });

  function updateBadge(){
    document.getElementById('ww-tag').textContent=window.innerWidth||0;
    document.getElementById('wh-tag').textContent=window.innerHeight||0;
    const sw=document.getElementById('score');
    if(sw){
      const r=sw.getBoundingClientRect();
      document.getElementById('dim-w').textContent=Math.round(r.width);
      document.getElementById('dim-h').textContent=Math.round(r.height);
      // Mode ligne unique : afficher le nombre de mesures et la largeur de contenu
      const nMes=(state.measures||[]).length;
      const lc=state._layoutCache;
      const cw=lc?lc.contentPxW:0;
      document.getElementById('svg-h').textContent=nMes+' mes · ligne unique · contenu '+cw+'px';
    }
  }
  // Sélection d'une note/silence par clic sur la portée
  document.getElementById('score').addEventListener('click',(e)=>{
    const t=e.target;
    if(!t||t.tagName!=='rect')return;
    const m=t.getAttribute('data-m');
    const s=t.getAttribute('data-s');
    if(m===null||s===null)return;
    const mi=parseInt(m,10),si=parseInt(s,10);
    if(isNaN(mi)||isNaN(si))return;
    if(mi<0||mi>=state.measures.length)return;
    if(si<0||si>=state.measures[mi].length)return;
    // Sélection d'une portion de notes (2 clics) : intercepte le clic.
    if(state._notePick){state._notePick(mi,si);return;}
    // Si un sélecteur de plage est ouvert : le clic remplit la valeur de la ligne active
    if(state._rangePick){state._rangePick(mi+1);return;}
    state.sel={m:mi,s:si};
    render();
  });

  let resizeTimer=null;
  window.addEventListener('resize',()=>{
    updateBadge();
    if(resizeTimer)clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{render()},120);
  });
  updateBadge();

  // Clic sur la partition : selectionner le slot/mesure cliques
  document.getElementById('score').addEventListener('click',(e)=>{
    const t=e.target;
    if(!t||t.dataset.m===undefined||t.dataset.s===undefined)return;
    const m=parseInt(t.dataset.m,10);
    const s=parseInt(t.dataset.s,10);
    if(isNaN(m)||isNaN(s))return;
    if(state._rangePick){if(m>=0&&m<state.measures.length)state._rangePick(m+1);return;}
    if(state.measures[m]&&state.measures[m][s]){
      state.sel={m,s};
      onSelMoved();
      render();
      // Jouer la note cliquée (silences ignorés). Aperçu sonore court.
      playSelectedSlot();
    }
  });

  // ===== Mode A4 (iframe isolee) + .atm + tablature =====
  let _a4Ready=false, _a4Pending=null;
  function _a4Doc(){ const t=document.getElementById('a4-doc-b64'); if(!t)return ''; try{ const bin=atob((t.textContent||'').trim()); const by=Uint8Array.from(bin,function(c){return c.charCodeAt(0);}); return new TextDecoder('utf-8').decode(by); }catch(e){ return ''; } }
  function _a4Win(){ const fr=document.getElementById('a4-frame'); return fr?fr.contentWindow:null; }
  function _a4Init(){ const fr=document.getElementById('a4-frame'); if(!fr||fr.getAttribute('data-init'))return; fr.setAttribute('data-init','1'); fr.addEventListener('load',function(){ _a4Ready=true; }); fr.srcdoc=_a4Doc(); }
  function _a4Settings(){ try{ const w=_a4Win(); if(_a4Ready&&w&&w.__MEP)return w.__MEP.getSettings(); }catch(e){} return _a4Pending||{}; }
  function _a4TabConfig(){ if(!state.tabMode)return null; const voices={}; (state.tracks||[]).forEach(function(t,i){ voices[i]={show:(t.tabShow!==false),octave:(t.tabOctave||0),gap:(t.tabGap||0)}; }); return {mode:state.tabMode,voices:voices}; }
  function _a4DiatoConfig(){ if(!state.diatoOn)return null; return {on:true,system:(state.diatoSystem||'corgeron'),outer:(state.diatoOuter||55),rows:(state.diatoRows||2),strategy:(state.diatoStrategy||'tirepousse'),ov:(state.diatoOv||{}),gap:(state.diatoGap||0)}; }
  function _a4AtmPayload(){ const o=_a4Settings()||{}; o.__tab=_a4TabConfig(); return o; }
  function _a4Feed(){ try{ const w=_a4Win(); if(w&&w.__MEP){ w.__MEP.load(buildAbcText()); if(_a4Pending){ try{w.__MEP.setSettings(_a4Pending);}catch(e){} _a4Pending=null; } try{ if(w.__MEP.setTab)w.__MEP.setTab(_a4TabConfig()); }catch(e){} try{ if(w.__MEP.setDiato)w.__MEP.setDiato(_a4DiatoConfig()); }catch(e){} w.__MEP.render(); } }catch(e){} }
  function openA4(){ const ov=document.getElementById('a4-overlay'); if(!ov)return; _a4Init(); ov.style.display='flex'; if(_a4Ready){ _a4Feed(); } else { const fr=document.getElementById('a4-frame'); fr.addEventListener('load',function _o(){ fr.removeEventListener('load',_o); _a4Ready=true; setTimeout(_a4Feed,30); }); } }
  function closeA4(){ const ov=document.getElementById('a4-overlay'); if(ov)ov.style.display='none'; }
  function buildAtmText(payload){ let abc=buildAbcText(); if(abc.charAt(abc.length-1)!=='\n')abc+='\n'; return abc+'%%atm-layout '+JSON.stringify(payload||{})+'\n'; }
  async function gzipText(t){ const cs=new CompressionStream('gzip'); const w=cs.writable.getWriter(); w.write(new TextEncoder().encode(t)); w.close(); return new Uint8Array(await new Response(cs.readable).arrayBuffer()); }
  async function gunzipToText(b){ const ds=new DecompressionStream('gzip'); const w=ds.writable.getWriter(); w.write(b); w.close(); return new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()); }
  async function saveAtm(){ const base=(state.openedFileName||(typeof proposedBaseName==='function'?proposedBaseName():'partition')); const text=buildAtmText(_a4AtmPayload()); if(window.showSaveFilePicker){ try{ const handle=await window.showSaveFilePicker({suggestedName:base+'.atm',types:[{description:'ATM (texte éditable)',accept:{'application/octet-stream':['.atm']}},{description:'ATMZ (compressé)',accept:{'application/gzip':['.atmz']}}]}); const nm=handle.name||(base+'.atm'); const isZ=/\.atmz$/i.test(nm); const data=isZ?await gzipText(text):text; const w=await handle.createWritable(); await w.write(new Blob([data])); await w.close(); state.openedFileName=nm.replace(/\.[^.]+$/,''); state.openedFileExt=isZ?'.atmz':'.atm'; if(typeof render==='function')render(); if(typeof flash==='function')flash('Enregistré : '+nm); return; }catch(e){ if(e&&e.name==='AbortError')return; } } const blob=new Blob([text],{type:'text/plain'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=base+'.atm'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); if(typeof flash==='function')flash('Téléchargé : '+base+'.atm'); }
  function loadAtm(text,fileName){ let obj=null; const m=text.match(/^%%atm-layout[ \t]+(.+)$/m); if(m){ try{ obj=JSON.parse(m[1]); }catch(e){} } const abc=text.replace(/^%%atm-layout[ \t]+.*$/m,'').replace(/\n{3,}/g,'\n\n'); let tab=null; if(obj&&obj.__tab!==undefined){ tab=obj.__tab; delete obj.__tab; } loadTuneAbc(abc,fileName); _a4Pending=obj; if(tab&&tab.mode){ state.tabMode=tab.mode; (state.tracks||[]).forEach(function(t,i){ const v=tab.voices&&tab.voices[i]; if(v){ t.tabShow=v.show!==false; t.tabOctave=v.octave||0; if(v.gap!==undefined)t.tabGap=v.gap; } }); if(typeof renderTabPanel==='function')renderTabPanel(); render(); } else { state.tabMode=null; } _a4Init(); if(typeof flash==='function')flash('Fichier .atm chargé — mise en page incluse'); }
  { const b=document.getElementById('btn-a4'); if(b)b.addEventListener('click',openA4); }
  { const b=document.getElementById('a4-close'); if(b)b.addEventListener('click',closeA4); }
  { const b=document.getElementById('a4-refresh'); if(b)b.addEventListener('click',_a4Feed); }
  { const b=document.getElementById('btn-save-atm'); if(b)b.addEventListener('click',saveAtm); }
  function transposeSelSemitone(d){ const sl=selectedSlot(); if(!sl||sl.type!=='note')return; const pf=(d<0); transposeNoteObj(sl,d,pf); if(sl.stack&&sl.stack.length)sl.stack.forEach(function(o){transposeNoteObj(o,d,pf);}); pushHistory(); render(); }
  { const b=document.getElementById('btn-semi-down'); if(b)b.addEventListener('click',function(){transposeSelSemitone(-1);}); }
  { const b=document.getElementById('btn-semi-up'); if(b)b.addEventListener('click',function(){transposeSelSemitone(1);}); }
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ const ov=document.getElementById('a4-overlay'); if(ov&&ov.style.display!=='none')closeA4(); } });
  _a4Init();
  rebuildMeasures();pushHistory();render();
})();
</script>
